name: CI

# Runs selftest.py on every PR into main. Required check for branch protection + auto-merge
# (see docs/ops/fleet-kit-governance.md). Mirrors nonprofit-atlas's ci.yml shape -- same
# pattern, different repo, since fleet-kit had no CI at all before this (confirmed live
# 2026-08-28: every fleet-kit merge to date was a direct human push to main, no check ever
# ran automatically).
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This is the ONLY required status check (branch protection + auto-merge key on the name
  # "selftest" -- see docs/ops/fleet-kit-governance.md). gh#804: it must never run a step that
  # reaches a third party, or that third party's uptime becomes this repo's ability to merge
  # anything -- an apt 403 from packages.microsoft.com ejected PR #801 (one markdown file, no
  # relation to Playwright) from the merge queue. Playwright's system-dependency install lives
  # in the playwright-tests job below instead, which still runs on every PR but is not required.
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install selftest.py's own import-time deps
        run: pip install pyyaml
      - name: run selftest.py
        run: python3 scripts/selftest.py
      - name: run test_ci_required_check_gh804.py
        run: python3 scripts/test_ci_required_check_gh804.py
      - name: run test_vp_labels.py
        run: python3 scripts/test_vp_labels.py
      - name: run members/librarian/test_librarian.py
        run: python3 members/librarian/test_librarian.py
      - name: run test_worktree_lock.py
        run: python3 scripts/test_worktree_lock.py
      - name: run test_worktree_prune.py
        run: python3 scripts/test_worktree_prune.py
      - name: run test_worktree_builder_prune.py
        run: python3 scripts/test_worktree_builder_prune.py
      - name: run test_claude_concurrency.py
        run: python3 scripts/test_claude_concurrency.py
      - name: run test_dispatch_lock.py
        run: python3 scripts/test_dispatch_lock.py
      - name: run test_charter_bloat_check.py
        run: python3 scripts/test_charter_bloat_check.py
      - name: run test_deploy_health_and_retire.py
        run: python3 scripts/test_deploy_health_and_retire.py
      - name: run test_kpi_calendar_day_gh265.py
        run: python3 scripts/test_kpi_calendar_day_gh265.py
      - name: run test_prod_health_check.py
        run: python3 scripts/test_prod_health_check.py
      - name: run test_fixer_fire_path.py
        run: python3 scripts/test_fixer_fire_path.py
      - name: run test_philanthropy_drivers.py
        run: python3 scripts/test_philanthropy_drivers.py
      - name: run test_ui_render_check.py
        run: python3 scripts/test_ui_render_check.py

  # Not a required check (see selftest above for why) -- but still runs on every PR, and its
  # failures are still visible on the PR's checks tab. `--with-deps` here can still fail on an
  # apt mirror outage; that is fine, since nothing required depends on this job's result.
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write  # gh#809: post the UI render check's screenshot/console report
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gh#809: needs full history to diff against the PR's base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install playwright
        run: pip install playwright==1.62.0
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.62.0
      - name: install playwright chromium
        run: playwright install --with-deps chromium
      - name: run test_settings_wiring.py
        run: python3 scripts/test_settings_wiring.py

      # gh#809: give the fleet a pre-merge look at its own UI. Only runs the (heavier) render
      # step when the diff actually touches a rendered surface -- criterion 3, no added latency
      # otherwise. Never blocks the PR (criterion 5) -- report only, no verdict (gh#809 non-goal).
      - name: detect UI-relevant changes (gh#809)
        id: ui_detect
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '\.(html|css)$|^scripts/fleet_view_server\.py$|^scripts/status_page\.py$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: run UI render check (gh#809)
        if: steps.ui_detect.outputs.relevant == 'true'
        run: >
          python3 scripts/ui_render_check.py
          --base "origin/${{ github.event.pull_request.base.ref }}"
          --out qa-out/ui_render
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: upload UI render evidence (gh#809)
        if: steps.ui_detect.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-render-check
          path: qa-out/ui_render
      # gh#809 VP review round 1: --edit-last so a PR with five pushes carries one current
      # render comment instead of five stale ones (falls back to a fresh comment on the first
      # push, when there is no prior render comment to edit).
      - name: post UI render comment (gh#809)
        if: steps.ui_detect.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file qa-out/ui_render/report.md --edit-last \
          || gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file qa-out/ui_render/report.md
