<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fleet-kit — live</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --border: #262b33; --text: #d7dce2; --dim: #6b7480;
    --ok: #3e9b5c; --warn: #c9a227; --bad: #c9463e; --accent: #4a8fd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "SF Mono", ui-monospace, monospace; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .layout { display: grid; grid-template-columns: 1.1fr 0.9fr 0.9fr 0.7fr 1fr; gap: 1px; background: var(--border);
    min-height: calc(100vh - 41px); }
  .col { background: var(--bg); overflow: auto; max-height: calc(100vh - 41px); }
  .col-head { padding: 8px 12px; font-weight: 600; color: var(--dim); text-transform: uppercase;
    font-size: 11px; letter-spacing: .05em; position: sticky; top: 0; background: var(--bg);
    border-bottom: 1px solid var(--border); }
  .row { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .row:hover { background: var(--panel); }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px;
    font-weight: 600; text-transform: uppercase; }
  .pill.ok { background: rgba(62,155,92,.18); color: var(--ok); }
  .pill.quiet { background: rgba(201,162,39,.18); color: var(--warn); }
  .pill.reported_nothing, .pill.no_vision_link, .pill.fail { background: rgba(201,70,62,.18); color: var(--bad); }
  .pill.pending { background: rgba(107,116,128,.18); color: var(--dim); }
  .row .meta { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .row .outcome { margin-top: 4px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; padding: 2px 8px; font-size: 11px; cursor: pointer; font-family: inherit; }
  button:hover { border-color: var(--accent); }
  .actions { margin-top: 4px; display: flex; gap: 6px; }
  #empty { padding: 20px; color: var(--dim); text-align: center; }
  button.on { border-color: var(--ok); color: var(--ok); }
  button.off { border-color: var(--bad); color: var(--bad); }
  .checks-green { color: var(--ok); } .checks-pending { color: var(--warn); } .checks-failing { color: var(--bad); }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <h1>fleet-kit</h1>
  <span id="repo" style="color:var(--dim)"></span>
  <span style="flex:1"></span>
  <button id="masterToggle" style="font-weight:600"></button>
</header>
<div class="layout">
  <div class="col">
    <div class="col-head">Runs (live)</div>
    <div id="runs"><div id="empty">waiting for the first pass…</div></div>
  </div>
  <div class="col">
    <div class="col-head">Open PRs</div>
    <div id="prs"></div>
  </div>
  <div class="col">
    <div class="col-head">Backlog (issues)</div>
    <div class="row"><button id="newIssue">+ new issue</button></div>
    <div id="issues"></div>
  </div>
  <div class="col">
    <div class="col-head">Cron queue (next fire)</div>
    <div id="queue"></div>
  </div>
  <div class="col">
    <div class="col-head">Members &amp; spend (24h)</div>
    <div id="members"></div>
  </div>
</div>
<script>
const runsEl = document.getElementById('runs');
const prsEl = document.getElementById('prs');
const issuesEl = document.getElementById('issues');
const dot = document.getElementById('dot');

function esc(s) { return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(iso_or_epoch) {
  if (!iso_or_epoch) return '';
  const t = typeof iso_or_epoch === 'number' ? iso_or_epoch * 1000 : Date.parse(iso_or_epoch);
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}

function renderRun(rec) {
  const div = document.createElement('div');
  div.className = 'row';
  const status = rec.status || 'pending';
  const pr = rec.pr ? `<a href="#" data-pr="${esc(rec.pr)}">PR #${esc(rec.pr)}</a>` : '';
  div.innerHTML = `
    <span class="pill ${esc(status)}">${esc(status)}</span>
    <b>${esc(rec.member)}</b>
    <span class="meta">${esc(rec.kind || '')} · item ${esc(rec.item_id || '—')} ${pr ? '· ' + pr : ''}</span>
    <div class="outcome">${esc(rec.outcome || '(no outcome reported)')}</div>
    ${rec.evidence ? `<div class="meta">${esc(rec.evidence)}</div>` : ''}
    ${rec.tokens && rec.tokens.cost_usd ? `<div class="meta">$${Number(rec.tokens.cost_usd).toFixed(3)} · ${esc(rec.tokens.num_turns)} turns</div>` : ''}
    <div class="actions">
      <button data-act="steer" data-member="${esc(rec.member)}">throttle ${esc(rec.member)}</button>
    </div>`;
  document.getElementById('empty')?.remove();
  runsEl.prepend(div);
  while (runsEl.children.length > 300) runsEl.removeChild(runsEl.lastChild);
}

function renderGh(gh) {
  prsEl.innerHTML = (gh.prs || []).map(pr => {
    const cls = pr._rollup === 'green' ? 'checks-green' : pr._rollup === 'failing' ? 'checks-failing' : 'checks-pending';
    return `<div class="row">
      <a href="${esc(pr.url)}" target="_blank">#${pr.number}</a> ${pr.isDraft ? '<span class="meta">draft</span>' : ''}
      <div>${esc(pr.title)}</div>
      <div class="meta"><span class="${cls}">${esc(pr._rollup)}</span> · ${esc(pr.headRefName)} · ${ago(pr.updatedAt)}</div>
      <div class="actions"><button data-act="close_pr" data-pr="${pr.number}">close</button></div>
    </div>`;
  }).join('') || '<div id="empty">no open PRs</div>';

  issuesEl.innerHTML = (gh.issues || []).map(i => `<div class="row">
      <a href="#" class="meta">#${i.number}</a>
      <div>${esc(i.title)}</div>
      <div class="meta">${i._claimed ? '<span class="pill quiet">claimed</span>' : '<span class="pill ok">open</span>'} · ${ago(i.updatedAt)}</div>
      <div class="actions">
        ${i._claimed ? `<button data-act="prune" data-issue="${i.number}">release claim</button>` : ''}
        <button data-act="comment_issue" data-issue="${i.number}">comment</button>
        <button data-act="close_issue" data-issue="${i.number}">close</button>
      </div>
    </div>`).join('') || '<div id="empty">backlog empty</div>';
}

function fmtIn(s) {
  if (s === null || s === undefined) return '—';
  if (s <= 0) return 'due now';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  return (s / 3600).toFixed(1) + 'h';
}

async function renderQueue() {
  const { next_fires } = await (await fetch('/api/next_fires')).json();
  document.getElementById('queue').innerHTML = (next_fires || []).map(f => `<div class="row">
      <b>${esc(f.member)}</b> ${f.enabled ? '' : '<span class="pill quiet">off</span>'}
      <div class="meta">in ${fmtIn(f.in_s)}${f.next_at ? ' · ' + esc(f.next_at) : ''}</div>
    </div>`).join('') || '<div id="empty">no members</div>';
}

document.body.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'steer') {
    const key = prompt('override key (max_turns, model, enabled, schedule):', 'max_turns');
    if (!key) return;
    const value = prompt('value (JSON, e.g. 20 or "sonnet" or false):');
    if (value === null) return;
    const why = prompt('why? (required)', 'throttled from fleet-view');
    if (!why) return;
    let parsed; try { parsed = JSON.parse(value); } catch { parsed = value; }
    const r = await fetch('/api/steer', { method: 'POST', body: JSON.stringify(
      { member: b.dataset.member, key, value: parsed, why }) });
    alert((await r.json()).ok ? 'applied' : 'failed — see server log');
  } else if (act === 'prune') {
    if (!confirm(`release the claim on issue #${b.dataset.issue}?`)) return;
    const r = await fetch('/api/prune', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue }) });
    alert((await r.json()).ok ? 'released' : 'failed — see server log');
  } else if (act === 'close_pr') {
    if (!confirm(`close PR #${b.dataset.pr}?`)) return;
    const r = await fetch('/api/close_pr', { method: 'POST', body: JSON.stringify({ pr: b.dataset.pr }) });
    alert((await r.json()).ok ? 'closed' : 'failed — see server log');
  } else if (act === 'comment_issue') {
    const text = prompt(`comment on issue #${b.dataset.issue}:`);
    if (!text) return;
    const r = await fetch('/api/comment_issue', { method: 'POST', body: JSON.stringify(
      { issue: b.dataset.issue, body: text }) });
    alert((await r.json()).ok ? 'commented' : 'failed — see server log');
  } else if (act === 'close_issue') {
    if (!confirm(`close issue #${b.dataset.issue}?`)) return;
    const reason = confirm('mark "not planned" (cancel = "completed")?') ? 'not planned' : 'completed';
    const r = await fetch('/api/close_issue', { method: 'POST', body: JSON.stringify(
      { issue: b.dataset.issue, reason }) });
    alert((await r.json()).ok ? 'closed' : 'failed — see server log');
  }
});

document.getElementById('newIssue').addEventListener('click', async () => {
  const title = prompt('issue title:');
  if (!title) return;
  const lane = prompt('lane label (e.g. devops, ui, fleet) — optional:', '');
  const body = prompt('body — optional:', '');
  const r = await fetch('/api/create_issue', { method: 'POST', body: JSON.stringify({ title, lane, body }) });
  alert((await r.json()).ok ? 'filed' : 'failed — see server log');
});

const membersEl = document.getElementById('members');
const DIAL_KEYS = ['max_turns', 'model', 'enabled', 'schedule'];

function dialValue(eff, key) {
  if (key === 'enabled') return eff.enabled;
  if (key === 'schedule') return JSON.stringify(eff.schedule);
  return (eff.llm || {})[key];
}

async function renderFleetState() {
  const state = await (await fetch('/api/fleet_state')).json();
  const btn = document.getElementById('masterToggle');
  btn.textContent = state.FLEET_ENABLED ? '● fleet ON — click to stop everything' : '○ fleet OFF';
  btn.className = state.FLEET_ENABLED ? 'on' : 'off';
  btn.onclick = async () => {
    if (state.FLEET_ENABLED && !confirm('stop the WHOLE fleet? every member exits on its next tick.')) return;
    await fetch('/api/fleet_toggle', { method: 'POST', body: JSON.stringify(
      { target: 'fleet', value: !state.FLEET_ENABLED }) });
    renderFleetState(); renderMembers();
  };
  return state;
}

// on/off + run-now render straight off /api/members (the real spec.enabled per member) --
// no second hardcoded name list to drift out of sync with the real members/*.fleet.json files
// (the old ['builder','reviewer'] list did exactly that the moment run_member.sh + the other
// 6 charters landed 2026-08-21 and every button here 400'd silently).
async function renderRunnableMembers(members) {
  document.getElementById('runnable').innerHTML = members.map(m => {
    const name = m.spec.name;
    const on = !!m.effective.enabled;
    return `<div class="row">
      <b>${esc(name)}</b>
      <div class="actions">
        <button class="${on ? 'on' : 'off'}" data-act="toggle-member" data-member="${esc(name)}" data-on="${on}">
          ${on ? '● enabled' : '○ disabled'}
        </button>
        <button data-act="run-now" data-member="${esc(name)}">run now</button>
      </div>
    </div>`;
  }).join('');
}

async function renderMembers() {
  const [{ members }, { spend }] = await Promise.all([
    fetch('/api/members').then(r => r.json()),
    fetch('/api/spend?hours=24').then(r => r.json()),
  ]);
  const spendByMember = Object.fromEntries((spend || []).map(s => [s.member, s]));
  const specRows = members.map(m => {
    const name = m.spec.name;
    const s = spendByMember[name];
    const spendLine = s
      ? `<span class="meta">$${(s.total_cost || 0).toFixed(2)} / ${s.runs} runs / ${s.total_turns || 0} turns (24h)</span>`
      : `<span class="meta">no runs in 24h</span>`;
    const overrideNote = m.overrides.length
      ? `<div class="meta">live overrides: ${m.overrides.map(o => `${o.key}=${JSON.stringify(o.value)} (${esc(o.why)})`).join(', ')}</div>`
      : '';
    const dials = DIAL_KEYS.map(key => {
      const v = dialValue(m.effective, key);
      return `<button data-act="edit-dial" data-member="${esc(name)}" data-key="${key}"
        title="click to change">${key}=${esc(JSON.stringify(v))}</button>`;
    }).join(' ');
    return `<div class="row">
      <b>${esc(name)}</b> <span class="meta">${esc(m.spec.kind)}${m.spec.lane ? ' · ' + esc(m.spec.lane) : ''}</span>
      <div>${spendLine}</div>
      ${overrideNote}
      <div class="actions" style="flex-wrap:wrap">${dials}</div>
    </div>`;
  }).join('');
  membersEl.innerHTML = (specRows || '<div id="empty">no members/*.fleet.json found</div>')
    + '<div class="col-head" style="margin-top:8px">On / off / run now</div><div id="runnable"></div>';
  renderRunnableMembers(members);
}

document.body.addEventListener('click', async (e) => {
  const dial = e.target.closest('button[data-act="edit-dial"]');
  if (dial) {
    const key = dial.dataset.key;
    const value = prompt(`new value for ${dial.dataset.member}.${key} (JSON):`);
    if (value === null) return;
    const why = prompt('why? (required)', 'tuned from fleet-view');
    if (!why) return;
    let parsed; try { parsed = JSON.parse(value); } catch { parsed = value; }
    const r = await fetch('/api/steer', { method: 'POST', body: JSON.stringify(
      { member: dial.dataset.member, key, value: parsed, why }) });
    if ((await r.json()).ok) renderMembers(); else alert('failed — see server log');
    return;
  }
  const toggle = e.target.closest('button[data-act="toggle-member"]');
  if (toggle) {
    const willBeOn = toggle.dataset.on !== 'true';
    await fetch('/api/fleet_toggle', { method: 'POST', body: JSON.stringify(
      { target: toggle.dataset.member, value: willBeOn }) });
    renderMembers();
    renderQueue();
    return;
  }
  const runNow = e.target.closest('button[data-act="run-now"]');
  if (runNow) {
    const name = runNow.dataset.member;
    if (!confirm(`run ${name} right now, off-cron?`)) return;
    const r = await fetch('/api/run_now', { method: 'POST', body: JSON.stringify({ member: name }) });
    const j = await r.json();
    alert(j.ok ? `${name} started — watch the Runs column` : `failed: ${j.error || 'see server log'}`);
    return;
  }
});

async function boot() {
  const snap = await (await fetch('/api/snapshot')).json();
  snap.runs.slice().reverse().forEach(renderRun);
  renderGh(snap.gh);
  renderFleetState();
  renderMembers();
  renderQueue();
  setInterval(renderMembers, 30000);
  setInterval(renderQueue, 15000);

  const es = new EventSource('/api/stream');
  es.onopen = () => dot.classList.add('live');
  es.onerror = () => dot.classList.remove('live');
  es.addEventListener('run', e => { renderRun(JSON.parse(e.data)); });
  es.addEventListener('gh', e => renderGh(JSON.parse(e.data)));
}
boot();
</script>
</body>
</html>
