<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fleet-kit console</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f3; --border: #d8dce2;
    --text: #1c1e21; --dim: #6b6f76; --dimmer: #9a9ea6;
    --ok: #1f8b4c; --warn: #a6720f; --bad: #c13a2e; --accent: #2166c4;
    --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 var(--mono); overflow: hidden; }
  button { font-family: inherit; font-size: 12px; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }

  /* ---------- shell: topbar + sidebar + detail, all fixed-height regions, only the
     scrollable inner lists scroll -- no page-level scroll, ever. ---------- */
  .shell { display: grid; grid-template-rows: 40px 1fr; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 0 14px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .topbar .brand { font-weight: 600; letter-spacing: .02em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dimmer); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
  .topbar .spacer { flex: 1; }
  .topbar .stat { color: var(--dim); font-size: 11.5px; }
  .topbar .stat b { color: var(--text); }
  .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; }
  .btn:hover { border-color: var(--accent); }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.go { border-color: var(--ok); color: var(--ok); }
  .btn.small { padding: 2px 7px; font-size: 11px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }

  /* ---------- top banners: gh#262 boot-error banner, and gh#399's /api/alerts banner stacked
     below it. Both used to be one fixed overlay each at the same top:40px, which would
     overlap if a boot error AND an open alert were ever visible at once -- so the fixed
     positioning now lives on the shared wrapper and the individual banners just flow inside
     it, keeping the exact same look (this is the only place .boot-error-banner is used, so
     nothing else depends on it carrying its own position). ---------- */
  .top-banners { position: fixed; top: 40px; left: 0; right: 0; z-index: 50;
    display: flex; flex-direction: column; }
  .boot-error-banner { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--bad); color: #fff; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .boot-error-banner .msg { flex: 1; }
  .boot-error-banner .btn { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.4); }
  .boot-error-banner .btn:hover { border-color: #fff; }
  /* gh#399: a "degraded" alert is real but self-healing/bounded (see alert_store.py's own
     severity doc) -- render it as the existing --warn amber rather than the same red as a
     boot failure or a critical alert, so severity is visible at a glance. A "transient" alert
     is neither -- it means the check could not observe its target (e.g. a container mid
     restart) and alert_store.py never pages on it alone, so it gets a neutral grey rather
     than either alarm color: showing it at all (AC2's "worst != ok") without making it look
     like a confirmed fault. */
  .boot-error-banner.degraded { background: var(--warn); }
  .boot-error-banner.transient { background: var(--dim); }
  .topbar .stat.bad { color: var(--bad); font-weight: 600; }
  /* gh#513: "the number" -- three stat spans grouped so they never wrap apart from each
     other, same gap the topbar itself uses between its own direct children. */
  .topbar .numgrp { display: flex; gap: 14px; }

  .body { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }

  /* ---------- sidebar: the agent roster, always visible, one click to switch ---------- */
  .sidebar { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
  .side-head { padding: 10px 12px 6px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--dimmer); }
  .agent-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px;
    cursor: pointer; border-left: 2px solid transparent; }
  .agent-item:hover { background: var(--panel-2); }
  .agent-item.active { background: var(--panel-2); border-left-color: var(--accent); }
  .agent-item .astatus { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 5px; }
  .astatus.ok { background: var(--ok); }
  .astatus.bad { background: var(--bad); }
  .astatus.warn { background: var(--warn); }
  .astatus.off { background: var(--dimmer); }
  .agent-item .atext { flex: 1; min-width: 0; }
  .agent-item .aname { overflow-wrap: break-word; }
  .agent-item.disabled-agent .aname { color: var(--dimmer); text-decoration: line-through; }
  .agent-item .aago { color: var(--dimmer); font-size: 10.5px; margin-top: 1px; }
  .agent-item .akpi { color: var(--dim); font-size: 10.5px; margin-top: 1px; font-weight: 600; }

  /* ---------- center: selected agent's detail -- header/actions fixed, run list scrolls ---------- */
  .detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .detail-head { padding: 12px 16px; background: var(--panel-2); border-bottom: 2px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.05); flex: none; }
  .detail-head .title-row { display: flex; align-items: center; gap: 10px; }
  .detail-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .detail-head .lane { color: var(--dim); font-size: 11.5px; }
  .detail-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .dial-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .dial { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 8px; font-size: 11px; color: var(--dim); cursor: pointer; }
  .dial:hover { border-color: var(--accent); color: var(--text); }
  .override-note { color: var(--warn); font-size: 11px; margin-top: 6px; }
  .spend-line { color: var(--dim); font-size: 11.5px; margin-top: 6px; }

  .hist-toggle { display: flex; gap: 4px; margin-top: 10px; }
  .hist-toggle button { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 10px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
  .hist-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .run-list { flex: 1; overflow-y: auto; min-height: 0; }
  .run-empty { padding: 30px; color: var(--dimmer); text-align: center; }
  /* A low Magikarp score only knows Splash. Honors reduced-motion. */
  @keyframes karpFlop {
    0%, 100% { transform: rotate(-7deg) translateY(0); }
    50%      { transform: rotate(7deg) translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    [style*="karpFlop"] { animation: none !important; }
  }
  .upcoming-card { margin: 16px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; }
  .upcoming-card .u-in { font-size: 20px; font-weight: 700; }
  .upcoming-card .rmeta { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
  .run-row { padding: 9px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .run-row:hover { background: var(--panel); }
  .run-row.open { background: var(--panel); }
  .run-row.live { border-left: 2px solid var(--accent); }
  .run-row .relapsed { color: var(--accent); font-weight: 600; }
  .run-row .rline1 { display: flex; align-items: baseline; gap: 8px; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 6px;
    border-radius: 3px; flex: none; }
  .badge.ok { background: rgba(76,175,111,.16); color: var(--ok); }
  .badge.quiet { background: rgba(217,164,65,.16); color: var(--warn); }
  .badge.reported_nothing, .badge.no_vision_link, .badge.fail { background: rgba(224,100,90,.16); color: var(--bad); }
  .badge.pending, .badge.upcoming { background: rgba(122,125,134,.16); color: var(--dim); }
  .run-row .rtime { color: var(--dimmer); font-size: 11px; margin-left: auto; flex: none; }
  .run-row .rmeta { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .run-row .routcome { margin-top: 5px; }
  .run-row .o-tldr { font-size: 13px; font-weight: 600; line-height: 1.4; }
  .run-row .o-detail { margin-top: 4px; color: var(--dim); font-size: 11.5px; line-height: 1.6; }
  .run-row .routcome code, .run-row .rmeta code { font-family: var(--mono); background: var(--panel-2);
    padding: 0 3px; border-radius: 3px; font-size: 11px; word-break: break-all; }
  .run-row .rid { color: var(--dimmer); font-size: 10.5px; margin-top: 2px; cursor: copy; }
  .run-row .rid:hover { color: var(--accent); }
  .dedup-badge { color: var(--accent); font-size: 10.5px; margin-left: 6px; }

  .transcript { display: none; margin-top: 7px; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; max-height: 320px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all; font-size: 11px; color: var(--dim); }
  .transcript.open { display: block; }
  /* The written report (persona_law §10c). Collapsed by default -- the row's own outcome line
     is the one-glance answer; this is the memo you open when that answer matters. Prose face
     and pre-wrap, because it is paragraphs and numbered points, not log lines. */
  .rreport { margin-top: 6px; }
  .rreport summary { cursor: pointer; font-size: 11px; color: var(--dimmer, #8a8f98);
                     letter-spacing: .04em; text-transform: uppercase; }
  .rreport-body { margin-top: 6px; padding-left: 12px; border-left: 3px solid var(--accent, #2166c4);
                  font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
                  font-size: 13px; line-height: 1.55; white-space: pre-wrap;
                  overflow-wrap: anywhere; }
  .tcopy-row { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .transcript .tline { padding: 2px 0; border-left: 2px solid transparent; padding-left: 6px; }
  .transcript .tline.live { color: var(--accent); }
  .transcript .tts { color: var(--dimmer); margin-right: 6px; font-size: 10px; }
  .transcript .ttext { white-space: pre-wrap; }
  /* thinking: italic + dim -- the model's own reasoning, lowest visual weight */
  .transcript .tk-thinking .ttext { font-style: italic; color: var(--dimmer); }
  /* tool call: accent-colored, bold-ish -- what the agent DID */
  .transcript .tk-call { border-left-color: var(--accent); }
  .transcript .tk-call .ttext { color: var(--text); }
  /* tool result ok: quiet dim green -- succeeded, not worth dwelling on */
  .transcript .tk-result-ok { border-left-color: var(--ok); }
  .transcript .tk-result-ok .ttext { color: var(--dim); }
  /* tool result ERROR: stays loud -- exactly what a human scans a transcript for, never muted */
  .transcript .tk-result-err { border-left-color: var(--bad); background: rgba(224,100,90,.08); }
  .transcript .tk-result-err .ttext { color: var(--bad); }
  /* pass start/end/result markers: a subtle divider, not a normal content row */
  .transcript .tk-marker { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 5px; }
  .transcript .tk-marker .ttext { color: var(--dimmer); font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  /* long tool result: short/full text coexist in the DOM, CSS swaps which shows */
  .transcript .tfull { display: none; }
  .transcript .tline-expanded .tshort { display: none; }
  .transcript .tline-expanded .tfull { display: inline; }
  .transcript .tmore { display: block; color: var(--accent); cursor: pointer; font-size: 10.5px; margin-top: 2px; }
  .transcript .tline-expanded .tmore { display: none; }
  .row.upcoming, .run-row.upcoming { opacity: .5; cursor: default; }

  /* ---------- pages: PRs+backlog and settings, now sidebar-selected views inside .detail ---------- */
  .rail-section { border-bottom: 1px solid var(--border); }
  .rail-head { padding: 9px 16px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dimmer); display: flex; align-items: center; gap: 6px; position: sticky; top: 0;
    background: var(--panel); }
  .count-badge { background: var(--panel-2); border-radius: 8px; padding: 0 6px; font-size: 10px; color: var(--dim); }
  .rail-row { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .rail-row .rmeta { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .rail-row .actions { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .rail-row .tag-row { margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; }
  .rail-row .tag { font-size: 10px; padding: 1px 7px; border-radius: 10px;
    background: color-mix(in srgb, var(--tag-color) 18%, var(--panel));
    color: color-mix(in srgb, var(--tag-color) 70%, var(--text)); border: 1px solid var(--tag-color); }
  .checks-green { color: var(--ok); } .checks-pending { color: var(--warn); } .checks-failing { color: var(--bad); }
  .checks-blocked { color: var(--bad); }

  /* ---------- Backlog filter bar: priority-tier toggle + title search (gh#193) ---------- */
  .queue-filter-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .queue-filter-bar .hist-toggle { margin-top: 0; }
  .queue-filter-bar input[type="search"] { flex: 1; min-width: 140px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; color: var(--text); }

  /* ---------- sidebar nav items: PRs/Backlog + Settings, same list as agents, separated ---------- */
  .side-nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
    border-left: 2px solid transparent; color: var(--text); }
  .side-nav-item:hover { background: var(--panel-2); }
  .side-nav-item.active { background: var(--panel-2); border-left-color: var(--accent); }
  .side-nav-item .count-badge { margin-left: auto; }
  .side-sep { border-top: 1px solid var(--border); margin: 6px 0; }

  .settings-block { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .settings-block h3 { margin: 0 0 8px; font-size: 12.5px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--dim); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 5px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: var(--dimmer); }

  .stats-page { padding: 16px; overflow-y: auto; }
  .stats-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px; margin-bottom: 16px; }
  .stats-card h3 { margin: 0 0 4px; font-size: 12.5px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--dim); }
  .stats-card .stats-sub { color: var(--dimmer); font-size: 11px; margin-bottom: 10px; }
  .stats-card canvas { max-height: 260px; }
  .runs-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi-cell .kpi-label { color: var(--dim); font-size: 11.5px; }
  .kpi-cell .kpi-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi-cell .kpi-sub { color: var(--dimmer); font-size: 11px; margin-top: 2px; }

  /* ---------- mobile: sidebar becomes a full-width overlay toggled by the ☰ button, detail
     pane takes the full screen, KPI grid stacks to 2-up. Desktop layout above is untouched --
     these rules only apply under the breakpoint. ---------- */
  @media (max-width: 700px) {
    #menuToggle { display: inline-block !important; }
    /* gh#157: the repo-URL stat wraps to multiple lines inside the topbar's fixed 40px band
       (no room to grow it without pushing the sidebar/detail down), overflowing both
       vertically and, at narrow phone widths (<=375px), horizontally past the viewport
       itself. It's the least essential item in the topbar on a phone -- brand name and the
       live dot already say which console this is -- so it's hidden rather than truncated. */
    #repo { display: none; }
    .body { grid-template-columns: 1fr; position: relative; overflow: hidden; }
    .sidebar { position: absolute; inset: 0; z-index: 20; width: 100%;
      transform: translateX(-100%); transition: transform .18s ease; }
    .body.sidebar-open .sidebar { transform: translateX(0); }
    .detail, #detailPane { width: 100%; }
    .runs-kpi-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stats-card { padding: 12px; }
    .stats-card canvas { max-height: 200px; }
    .detail-actions, .dial-row { gap: 5px; }
  }
.role-block{margin:6px 0 4px;font-size:13px;line-height:1.45}
.role-line{opacity:.9;max-width:900px}
.role-block details.steps{margin-top:4px}
.role-block summary{cursor:pointer;color:var(--accent,#0b57d0);font-weight:600}
.role-block ol{margin:6px 0 4px 18px;padding:0;max-width:900px}
.role-block li{margin:2px 0}
.role-esc{opacity:.85;margin:4px 0}
.role-src{opacity:.6;font-size:12px}
.home-section{margin-top:22px}
.home-agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px;margin-top:8px}
.home-agent{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line,#e4e4e4);border-radius:8px;cursor:pointer;background:var(--panel,#fff);min-height:40px}
.home-agent:hover{background:var(--panel-2)}
.home-agent .ha-name{font-weight:600;white-space:nowrap}
.home-agent .ha-meta{opacity:.7;font-size:12px;margin-left:auto;text-align:right}
.home-nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.home-nav{display:flex;align-items:center;gap:8px;padding:12px 12px;border:1px solid var(--line,#e4e4e4);border-radius:8px;cursor:pointer;background:var(--panel,#fff);font-weight:600;min-height:44px}
.home-nav:hover{background:var(--panel-2)}
@media (max-width: 700px){.home-agents,.home-nav-grid{grid-template-columns:1fr}}
</style>
<!-- Chart.js: Reif, 2026-08-25 -- "dont handroll, pick a nice graph element". This page already
     assumes internet access (calls GitHub's API, loads from a public domain), so a CDN script
     is consistent with what it already does, not a new dependency class. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="btn small" id="menuToggle" style="display:none;" onclick="document.querySelector('.body').classList.toggle('sidebar-open')">☰</button>
    <span class="dot" id="dot"></span>
    <span class="brand">fleet-kit</span>
    <select class="btn small" id="siblingSwitch" style="display:none;"></select>
    <span class="stat" id="repo"></span>
    <span class="numgrp" id="theNumber" style="display:none;">
      <span class="stat" id="numNumber"></span>
      <span class="stat" id="numGuardrail"></span>
      <span class="stat" id="numChannel"></span>
    </span>
    <span class="spacer"></span>
    <span class="stat" id="needsHumanOp"></span>
    <span class="stat" id="globalSpend"></span>
    <span class="stat bad" id="budgetUnsafe" style="display:none;"
      title="an open alert says the budget signal cannot be trusted -- see the alert banner">&#9888; budget unsafe</span>
  </div>
  <div class="top-banners">
    <div class="boot-error-banner" id="bootError" style="display:none;">
      <span class="msg" id="bootErrorMsg"></span>
      <button class="btn small" id="bootErrorRetry">retry</button>
      <button class="btn small" id="bootErrorDismiss">dismiss</button>
    </div>
    <div class="boot-error-banner" id="alertBanner" style="display:none;">
      <span class="msg" id="alertBannerMsg"></span>
    </div>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="side-head">Agents</div>
      <div id="agentList"></div>
      <div class="side-sep"></div>
      <div class="side-nav-item" data-page="home">Home</div>
      <div class="side-nav-item" data-page="queue">
        PRs &amp; Backlog <span class="count-badge" id="navQueueCount">0</span>
      </div>
      <div class="side-nav-item" data-page="merged">
        Recently Merged <span class="count-badge" id="navMergedCount">0</span>
      </div>
      <div class="side-nav-item" data-page="evolution">
        Self-Evolution <span class="count-badge" id="navEvolutionCount">0</span>
      </div>
      <div class="side-nav-item" data-page="stats">Stats</div>
      <div class="side-nav-item" data-page="settings">Settings</div>
    </div>
    <div class="detail" id="detailPane">
      <div class="detail-head" id="detailHead"></div>
      <div class="run-list" id="runList"><div class="run-empty">select an agent</div></div>
    </div>
  </div>
</div>
<script>
// ---------------------------------------------------------------------------------------------
// State: one flat run list (all agents, as they stream in) + a per-agent index into it, so
// switching the sidebar selection never refetches -- it just re-filters what's already in memory.
// ---------------------------------------------------------------------------------------------
let REPO_URL = '';
let SPECS = [];          // from /api/members -- spec + effective + overrides, per agent
let ALL_RUNS = [];        // oldest-first, matches runs.jsonl append order
let SELECTED = null;      // currently open agent name, or null (only meaningful when PAGE==='agent')
// gh#228 then gh#560: fire-first default. A fresh load (no prior click yet) lands on Home --
// the venture's number plus fleet-health tiles, the thing an operator glances at first -- not
// PRs & Backlog (gh#228's fix, still one click away) and never an arbitrary alphabetically-first
// agent's raw run log. Only switches to 'agent' once the operator actually clicks one, via
// selectAgent().
let PAGE = 'home';       // 'agent' | 'home' | 'queue' | 'settings' -- which sidebar item is active
let GH = { prs: [], issues: [], merged: [], self_evolution: [],
           needs_human_op: { count: 0, oldest_age_hours: 0 } };
let FLEET_STATE = {};
let NUMBER_DATA = null; // last /api/number payload -- shared by the topbar tile and renderHomePage()
let NEXT_FIRES = [];
let KPI_BY_MEMBER = {}; // member name -> /api/kpi row ({total, unit, runs_with_kpi, runs_total})
const dot = document.getElementById('dot');
const agentListEl = document.getElementById('agentList');
const detailHeadEl = document.getElementById('detailHead');
const runListEl = document.getElementById('runList'); // reused as the generic page-body region

function esc(s) { return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(iso_or_epoch) {
  if (!iso_or_epoch) return '';
  const t = typeof iso_or_epoch === 'number' ? iso_or_epoch * 1000 : Date.parse(iso_or_epoch);
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}
// Dates on this page arrive in three shapes: a full ISO timestamp
// ("2026-08-26T14:07:01Z"), a bare day ("2026-08-25"), and epoch seconds. Rendering any of
// them raw is what put "2026-08-26T14:07:01Z" on the Magikarp card -- machine-readable, and
// nobody reads it. Render a day as "Aug 26" and a timestamp as "Aug 26, 2:07pm", dropping the
// year (every date on this dashboard is within days of now, so the year is pure noise) and
// falling back to the raw string rather than "Invalid Date" if it does not parse.
function humanDate(v, opts) {
  if (!v && v !== 0) return '';
  const withTime = !(opts && opts.dayOnly === true);
  let d, hasTime;
  if (typeof v === 'number') { d = new Date(v * 1000); hasTime = true; }
  else {
    const str = String(v);
    // A bare "YYYY-MM-DD" is parsed as UTC midnight by Date, which renders as the PREVIOUS day
    // for anyone west of Greenwich. Split it instead so a day means that day, everywhere.
    const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) { d = new Date(+m[1], +m[2] - 1, +m[3]); hasTime = false; }
    else { d = new Date(str); hasTime = true; }
  }
  if (isNaN(d.getTime())) return String(v);
  const day = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  if (!hasTime || !withTime) return day;
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase().replace(' ', '');
  return `${day}, ${time}`;
}
function clockTime(epoch) {
  if (!epoch) return '';
  return new Date(epoch * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function fmtIn(s) {
  if (s === null || s === undefined) return '—';
  if (s <= 0) return 'due now';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  return (s / 3600).toFixed(1) + 'h';
}
// gh#562: elapsed time for a still-running pass -- start_ts is epoch seconds (run_report.py's
// build_started_record writes `time.time()`), same unit ago()/clockTime() already assume.
function fmtElapsed(startEpoch) {
  const s = Math.max(0, Date.now() / 1000 - startEpoch);
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}
function copyText(text, el) {
  const prev = el.textContent;
  const flash = (label) => { el.textContent = label; setTimeout(() => { el.textContent = prev; }, 900); };
  // Clipboard API can silently reject or hang (permission-gated, unfocused tab, non-secure
  // context) with nothing surfaced to the user -- confirmed live 2026-08-25: button click did
  // nothing, no console error, no visible failure. Fall back to the older execCommand path
  // (still works in every browser this dashboard runs in) rather than leaving a dead button.
  const legacyCopy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      flash(ok ? 'copied ✓' : 'copy failed');
    } catch { flash('copy failed'); }
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => flash('copied ✓')).catch(legacyCopy);
  } else {
    legacyCopy();
  }
}

// ---------------------------------------------------------------------------------------------
// Sidebar: one row per agent from /api/members (real spec discovery, not a hand list -- the
// old dashboard already learned that lesson the hard way once). Status dot reflects the most
// recent run's status for that agent, not just "enabled/disabled".
// ---------------------------------------------------------------------------------------------
function lastRunFor(name) {
  for (let i = ALL_RUNS.length - 1; i >= 0; i--) {
    if (ALL_RUNS[i].member === name) return ALL_RUNS[i];
  }
  return null;
}
function statusClass(status) {
  if (status === 'ok') return 'ok';
  if (status === 'quiet') return 'warn';
  // reported_nothing is a known classify() parser-miss (#135/#167), not a confirmed failure --
  // paint it the same "uncertain, go check" amber as quiet rather than burying real fails in it.
  if (status === 'reported_nothing') return 'warn';
  if (!status) return 'off';
  return 'bad'; // no_vision_link, fail, etc.
}

// gh#166: enabled:false is a legitimate permanent throttle for a dispatch-only member (nerd,
// minion -- they only ever run via another member's task-override, never self-fire), not proof
// the member is dead. Only treat "disabled" as "actually off" when there's also no run inside
// the same 24h lookback window the rest of this dashboard already uses (spend/turns labels).
const RECENT_RUN_WINDOW_MS = 24 * 3600 * 1000;
function hasRecentRun(last) {
  if (!last) return false;
  const tsMs = typeof last.ts === 'number' ? last.ts * 1000 : Date.parse(last.ts);
  return (Date.now() - tsMs) < RECENT_RUN_WINDOW_MS;
}

let SIDEBAR_ORDER = null; // cached agent-name order -- computed once per resort, not per render

function resortSidebar() {
  // Most-recently-run agent first -- a console should surface what just happened, not an
  // arbitrary spec-discovery order. Agents with no runs yet sort to the bottom.
  SIDEBAR_ORDER = SPECS.slice().sort((a, b) => {
    const la = lastRunFor(a.spec.name)?.ts ?? -1;
    const lb = lastRunFor(b.spec.name)?.ts ?? -1;
    return lb - la;
  }).map(m => m.spec.name);
}

function renderSidebar() {
  // Re-render must NOT re-sort: a live tick reordering rows while the user is mid-click moves
  // the row out from under the cursor (confirmed live -- a click on "marie" landed on
  // "Settings" because the list resorted between mousedown and click). Order only changes on
  // an explicit resortSidebar() call (boot, or a new agent appearing).
  if (!SIDEBAR_ORDER) resortSidebar();
  const byName = Object.fromEntries(SPECS.map(m => [m.spec.name, m]));
  const ranked = SIDEBAR_ORDER.map(n => byName[n]).filter(Boolean);
  // an agent /api/members returned that isn't in the cached order yet (newly added) -- append it
  SPECS.forEach(m => { if (!SIDEBAR_ORDER.includes(m.spec.name)) ranked.push(m); });
  agentListEl.innerHTML = ranked.map(m => {
    const name = m.spec.name;
    const enabled = !!m.effective.enabled;
    const last = lastRunFor(name);
    const off = !enabled && !hasRecentRun(last);
    const cls = off ? 'off' : statusClass(last?.status);
    const active = PAGE === 'agent' && name === SELECTED;
    const k = KPI_BY_MEMBER[name];
    const kpiLine = (k && k.total !== null && k.total !== undefined && k.unit)
      ? `<div class="akpi">${k.total} ${esc(k.unit)}</div>` : '';
    return `<div class="agent-item ${active ? 'active' : ''} ${off ? 'disabled-agent' : ''}"
        data-agent="${esc(name)}">
      <span class="astatus ${cls}"></span>
      <div class="atext">
        <div class="aname">${m.spec.emoji ? esc(m.spec.emoji) + ' ' : ''}${esc(name)}</div>
        <div class="aago">${last ? ago(last.ts) : 'never run'}</div>
        ${kpiLine}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.side-nav-item').forEach(el => {
    el.classList.toggle('active', PAGE === el.dataset.page);
  });
  document.getElementById('navQueueCount').textContent = (GH.prs?.length || 0) + (GH.issues?.length || 0);
  document.getElementById('navMergedCount').textContent = GH.merged?.length || 0;
  document.getElementById('navEvolutionCount').textContent = GH.self_evolution?.length || 0;
  renderNeedsHumanOp();
}

// gh#340: fleet:needs-human-op had zero notification surface -- the only consumer was gru's
// own build-candidate filter, so an issue like gh#278/gh#301 could sit silently for 11h40m+
// with no human ever seeing it. Always renders SOME text (never toggles display:none) so "0"
// and "feature not loaded" can't look the same on screen (AC3).
function renderNeedsHumanOp() {
  const el = document.getElementById('needsHumanOp');
  const nho = GH.needs_human_op || { count: 0, oldest_age_hours: 0 };
  if (!nho.count) {
    el.innerHTML = `0 <b>needs-human-op</b>`;
    el.style.color = '';
    return;
  }
  const hours = Math.round(nho.oldest_age_hours);
  el.innerHTML = `${nho.count} <b>needs-human-op</b> (oldest ${hours}h)`;
  el.style.color = 'var(--bad)';
}

// ---------------------------------------------------------------------------------------------
// Detail head: name, lane/kind, spend, live dials, and the action bar -- rerun/enable/disable
// all live right here, next to the agent you're looking at, not buried in a separate rail.
// ---------------------------------------------------------------------------------------------
const DIAL_KEYS = ['max_turns', 'model', 'enabled', 'schedule'];
function dialValue(eff, key) {
  if (key === 'enabled') return eff.enabled;
  if (key === 'schedule') return eff.schedule;
  return (eff.llm || {})[key];
}

// KPI-in-title text: "roomba · 47 worktrees evaluated today" when this member has a defined
// KPI shape and at least one counted run in the window; falls back to nothing (just the plain
// name) for a member with no KPI shape (fleet_kpi.py returns total:null for those) or zero
// counted runs yet -- never show a fabricated "0 <unit>" for a member that has no unit to begin
// with.
function kpiTitleSuffix(name) {
  const k = KPI_BY_MEMBER[name];
  if (!k || k.total === null || k.total === undefined || !k.unit) return '';
  return ` · ${k.total} ${k.unit} today`;
}

// Role overview + the actual steps a pass takes, straight from the member's fleet.json mandate
// (Reif, 2026-09-07: "emojis and role overview with the actual steps it takes, so someone can
// prune it from actual knowledge"). The checklist IS the pass; pruning a step means editing
// members/<name>/<name>.fleet.json, so the file path is shown next to it.
function roleBlock(spec) {
  const md = spec.mandate || {};
  if (!md.target && !(md.checklist || []).length) return '';
  const steps = (md.checklist || []).map(st => `<li>${esc(st)}</li>`).join('');
  const esc_ = (md.escalation || '');
  return `<div class="role-block">
      ${md.target ? `<div class="role-line"><b>Role</b> ${esc(md.target)}</div>` : ''}
      ${steps ? `<details class="steps"><summary>Steps each pass (${(md.checklist || []).length})</summary><ol>${steps}</ol>
        ${esc_ ? `<div class="role-esc"><b>Escalates when</b> ${esc(esc_)}</div>` : ''}
        <div class="role-src">from <code>members/${esc(spec.name)}/${esc(spec.name)}.fleet.json</code> — prune a step there</div></details>` : ''}
    </div>`;
}

function renderDetailHead() {
  const m = SPECS.find(s => s.spec.name === SELECTED);
  if (!m) { detailHeadEl.innerHTML = ''; return; }
  const name = m.spec.name;
  const enabled = !!m.effective.enabled;
  const spendEl = m._spend;
  const spendLine = spendEl
    ? `$${(spendEl.total_cost || 0).toFixed(2)} · ${spendEl.runs} runs · ${spendEl.total_turns || 0} turns (24h)`
    : 'no runs in 24h';
  const overrideNote = m.overrides.length
    ? `<div class="override-note">live overrides: ${m.overrides.map(o => `${esc(o.key)}=${esc(JSON.stringify(o.value))} (${esc(o.why)})`).join(', ')}</div>`
    : '';
  const dials = DIAL_KEYS.map(key => {
    const v = dialValue(m.effective, key);
    return `<button class="dial" data-act="edit-dial" data-member="${esc(name)}" data-key="${key}">${key}=${esc(JSON.stringify(v))}</button>`;
  }).join('');
  const next = NEXT_FIRES.find(f => f.member === name);
  const dispatchedOnly = !enabled && hasRecentRun(lastRunFor(name));
  const nextLine = next && next.enabled ? `next run in ${fmtIn(next.in_s)}`
    : (enabled ? '' : (dispatchedOnly ? 'dispatched only (no self-schedule)' : 'disabled — not scheduled'));

  detailHeadEl.innerHTML = `
    <div class="title-row">
      <h2>${m.spec.emoji ? esc(m.spec.emoji) + ' ' : ''}${esc(name)}${esc(kpiTitleSuffix(name))}</h2>
      <span class="lane">${esc(m.spec.kind)}${m.spec.lane ? ' · ' + esc(m.spec.lane) : ''}</span>
    </div>
    <div class="spend-line">${esc(spendLine)}${nextLine ? ' · ' + esc(nextLine) : ''}</div>
    ${overrideNote}
    ${roleBlock(m.spec)}
    <div class="detail-actions">
      <button class="btn primary" data-act="run-now" data-member="${esc(name)}">▶ rerun now</button>
      <button class="btn ${enabled ? 'danger' : 'go'}" data-act="toggle-member" data-member="${esc(name)}" data-on="${enabled}">
        ${enabled ? '■ disable' : '● enable'}
      </button>
    </div>
    <div class="dial-row">${dials}</div>
    <div class="hist-toggle">
      <button data-view="history" class="${RUN_VIEW === 'history' ? 'active' : ''}">history</button>
      <button data-view="upcoming" class="${RUN_VIEW === 'upcoming' ? 'active' : ''}">upcoming</button>
    </div>`;
}

// ---------------------------------------------------------------------------------------------
// Run list: filtered to the selected agent, newest at top (a console reads status top-down,
// unlike the old feed's chat-style bottom-anchor) -- own scroll region, page never scrolls.
// ---------------------------------------------------------------------------------------------
const memberRunTotal = {}; // per-member count for pass_log's seqFromEnd, same convention as before

function reindexSeq(name) {
  const runs = ALL_RUNS.filter(r => r.member === name);
  runs.forEach((r, i) => { r._seqFromEnd = runs.length - 1 - i; });
}

let OPEN_TRANSCRIPT_RUN_ID = null; // survives renderRunList() rebuilds -- see restoreOpenTranscript()
let RUN_VIEW = 'history'; // 'history' (past runs) | 'upcoming' (this member's single next scheduled fire)

// ---------------------------------------------------------------------------------------------
// Transcript line rendering: run_member.sh's stream_log.py writes every log line with a fixed
// prefix shape ("[ts] pass start ...", "[ts] thinking: ...", "[ts] tool call: X -- args",
// "[ts] tool result (ok|ERROR): ..."). Parse that prefix once per line so thinking/tool-call/
// tool-result/error render as visually distinct rows instead of one flat grey dump (Reif,
// 2026-08-25: "more readable transcript"). No backend change needed -- read_pass_block already
// returns these exact lines, this is purely a frontend render.
// ---------------------------------------------------------------------------------------------
const TLINE_RE = /^\[([^\]]+)\]\s(.*)$/s;
function classifyTline(raw) {
  const m = TLINE_RE.exec(raw);
  const ts = m ? m[1] : '';
  const rest = m ? m[2] : raw;
  let kind = 'plain';
  if (/^(pass start|pass end|pass result|session init)\b/.test(rest)) kind = 'marker';
  else if (rest.startsWith('thinking:')) kind = 'thinking';
  else if (rest.startsWith('tool call:')) kind = 'call';
  else if (rest.startsWith('tool result (ok')) kind = 'result-ok';
  else if (rest.startsWith('tool result (ERROR')) kind = 'result-err';
  return { ts, rest, kind };
}
function renderTline(raw, extraClass) {
  const { ts, rest, kind } = classifyTline(raw);
  // A long tool result (several samples run multi-KB) pushes everything else out of the
  // 320px-tall scrollable box -- collapse anything past 4 lines behind a toggle, always shown
  // in full for an ERROR (errors are exactly what a human scans for, never collapse those).
  // Full text is always in the DOM (never re-fetched on expand); CSS just switches which of
  // .tshort/.tfull is visible once '.tline-expanded' is added by the click handler.
  const lines = rest.split('\n');
  const long = kind !== 'result-err' && lines.length > 4;
  if (!long) {
    return `<div class="tline tk-${kind} ${extraClass || ''}">
      ${ts ? `<span class="tts">${esc(ts)}</span>` : ''}<span class="ttext">${esc(rest)}</span>
    </div>`;
  }
  const shortText = lines.slice(0, 4).join('\n');
  return `<div class="tline tk-${kind} ${extraClass || ''}">
    ${ts ? `<span class="tts">${esc(ts)}</span>` : ''}<span class="ttext tshort">${esc(shortText)}</span><span class="ttext tfull">${esc(rest)}</span>
    <span class="tmore" data-act="expand-tline">… ${lines.length - 4} more lines</span>
  </div>`;
}

async function loadTranscriptInto(box, rec) {
  box.dataset.loaded = '1';
  box.innerHTML = '<div class="tline">loading transcript…</div>';
  try {
    const r = await fetch(`/api/pass_log?member=${encodeURIComponent(rec.member)}&n=${rec._seqFromEnd}`);
    const { lines } = await r.json();
    // Raw lines kept on the box itself (not re-derived from rendered HTML, which has been
    // reformatted/collapsed) so the copy button always copies the real, complete transcript.
    box.dataset.rawLines = JSON.stringify(lines || []);
    const header = '<div class="tcopy-row"><button class="btn small" data-act="copy-transcript">copy transcript</button></div>';
    box.innerHTML = (lines && lines.length)
      ? header + lines.map(l => renderTline(l)).join('')
      : '<div class="tline">no transcript recorded for this pass</div>';
  } catch {
    box.innerHTML = '<div class="tline">failed to load transcript</div>';
  }
}

async function toggleTranscript(rowEl, rec) {
  const box = rowEl.querySelector('.transcript');
  if (!box) return;
  const willOpen = !box.classList.contains('open');
  box.classList.toggle('open', willOpen);
  rowEl.classList.toggle('open', willOpen);
  OPEN_TRANSCRIPT_RUN_ID = willOpen ? rec.run_id : null;
  if (willOpen && !box.dataset.loaded) await loadTranscriptInto(box, rec);
}

// A live tick / new run event rebuilds the whole run list from scratch (renderRunList below) --
// that used to silently close whatever transcript the user had open (confirmed live: "it closes
// too quickly"). Re-open the same run's box, right after each rebuild, using the cached run_id.
function restoreOpenTranscript() {
  if (!OPEN_TRANSCRIPT_RUN_ID) return;
  const rowEl = runListEl.querySelector(`.run-row[data-run-id="${CSS.escape(OPEN_TRANSCRIPT_RUN_ID)}"]`);
  const box = rowEl?.querySelector('.transcript');
  if (!box) return; // that run scrolled out of the (collapsed) group -- nothing to restore onto
  box.classList.add('open');
  rowEl.classList.add('open');
  const rec = ALL_RUNS.find(r => r.run_id === OPEN_TRANSCRIPT_RUN_ID);
  if (rec) loadTranscriptInto(box, rec); // re-fetch -- cheap, and the old dataset.loaded is gone
}

function noOutcomeHint(rec) {
  return rec.exit_code && rec.exit_code !== 0
    ? `exit code ${esc(rec.exit_code)} — crashed, not "found nothing"`
    : esc(rec.self_critique || 'ran fine, reported no outcome');
}

// Outcome strings are one run-on sentence (semicolon-joined clauses, absolute paths inline) --
// unreadable as a single paragraph (Reif, 2026-08-23 screenshot: "I cant read this"). Split into
// a bold TLDR (first clause) + the rest as dimmed detail lines, monospacing path-like tokens.
function formatOutcome(raw) {
  if (!raw) return '';
  const parts = raw.split(/;\s+/).map(p => p.trim()).filter(Boolean);
  const mono = s => esc(s).replace(/(\/[\w.\-\/]+\.\w+(?::\d+)?|#\d{3,})/g, '<code>$1</code>');
  const [tldr, ...rest] = parts;
  let html = `<div class="o-tldr">${mono(tldr)}</div>`;
  if (rest.length) html += `<div class="o-detail">${rest.map(mono).join('<br>')}</div>`;
  return html;
}

function runRowHtml(rec, dupCount, live) {
  const status = rec.status || 'pending';
  const pr = rec.pr
    ? (REPO_URL ? `<a href="${REPO_URL}/pull/${esc(rec.pr)}" target="_blank" onclick="event.stopPropagation()">PR #${esc(rec.pr)}</a>`
                : `PR #${esc(rec.pr)}`)
    : '';
  const dup = dupCount > 1 ? `<span class="dedup-badge">×${dupCount}</span>` : '';
  // gh#562 AC2: a "started" row with no completion yet gets a ticking elapsed timer instead of
  // the normal clockTime+ago -- tickLiveTimers() below updates this element's text every second
  // by re-reading data-start-ts, so this initial render just needs to seed it correctly.
  const timeHtml = live
    ? `<span class="rtime relapsed" data-start-ts="${esc(rec.ts || '')}">running ${fmtElapsed(rec.ts)}</span>`
    : `<span class="rtime">${rec.ts ? clockTime(rec.ts) + ' · ' + ago(rec.ts) : ''}</span>`;
  return `
    <div class="rline1">
      <span class="badge ${esc(status)}">${esc(status)}</span>
      <span class="rmeta">${esc(rec.kind || '')} · item ${esc(rec.item_id || '—')}${pr ? ' · ' + pr : ''}</span>
      ${dup}
      ${timeHtml}
    </div>
    <div class="routcome">${rec.outcome ? formatOutcome(rec.outcome) : noOutcomeHint(rec)}</div>
    ${rec.evidence ? `<div class="rmeta">${formatOutcome(rec.evidence)}</div>` : ''}
    ${rec.report ? `<details class="rreport"><summary>read the report</summary>
      <div class="rreport-body">${esc(rec.report)}</div></details>` : ''}
    ${(() => {
      // Every run should show its cost, even a zero-spend one -- a run card with a status
      // badge and no token line reads as "we don't know what this cost," when the real
      // answer for a budget_declined/exhausted run is "nothing, it never got to spend."
      // (Reif, 2026-08-25: "every fleet session should show its token usage" -- the truthy
      // `rec.tokens.cost_usd` check below silently dropped the whole line for cost_usd=0 or
      // =null, which is exactly every account-pool-exhausted run.)
      const t = rec.tokens;
      if (t && typeof t.cost_usd === 'number') {
        return `<div class="rmeta">$${t.cost_usd.toFixed(3)} · ${esc(t.num_turns ?? 0)} turns</div>`;
      }
      if (rec.status === 'budget_declined') {
        return `<div class="rmeta">$0.000 · declined before spending</div>`;
      }
      return '';
    })()}
    ${rec.run_id ? `<div class="rid" title="click to copy run_id">${esc(rec.run_id)}</div>` : ''}
    <div class="transcript"></div>`;
}

function renderUpcomingCard() {
  const m = SPECS.find(s => s.spec.name === SELECTED);
  const next = NEXT_FIRES.find(f => f.member === SELECTED);
  if (!next || !next.enabled) {
    const label = m && !m.effective.enabled
      ? (hasRecentRun(lastRunFor(SELECTED)) ? 'dispatched only (no self-schedule)' : 'disabled — not scheduled')
      : 'no upcoming run scheduled';
    runListEl.innerHTML = `<div class="run-empty">${label}</div>`;
    return;
  }
  const sched = (m?.spec?.schedule && JSON.stringify(m.spec.schedule)) || '';
  runListEl.innerHTML = `
    <div class="upcoming-card">
      <div class="u-in">next run in ${esc(fmtIn(next.in_s))}</div>
      <div class="rmeta">${esc(m?.spec?.kind || '')}${m?.spec?.lane ? ' · ' + esc(m.spec.lane) : ''}</div>
      ${sched ? `<div class="rmeta">schedule: <code>${esc(sched)}</code></div>` : ''}
      <div class="rmeta">only the next fire is known -- schedule is interval-based, not a queue</div>
    </div>`;
}

// gh#562: run_report.py writes two records under one run_id -- the provisional "started" row
// (gh#145), then the real completion row -- and both used to render as separate, stacked rows
// forever. Collapse a matched started+completion pair into the completion row alone; a started
// row with no completion yet is kept as its own row and marked live (runRowHtml gives it a
// ticking elapsed timer instead). AC4: a record with no run_id is never merged with anything.
function mergeRunIdPairs(runs) {
  const seenRunIds = new Set();
  const merged = [];
  for (const r of runs) {
    if (!r.run_id) { merged.push(r); continue; }
    if (seenRunIds.has(r.run_id)) continue;
    seenRunIds.add(r.run_id);
    const terminal = runs.find(o => o.run_id === r.run_id && o.status !== 'started');
    merged.push(terminal || r);
  }
  return merged;
}

function renderRunList() {
  if (!SELECTED) { runListEl.innerHTML = '<div class="run-empty">select an agent</div>'; return; }
  if (RUN_VIEW === 'upcoming') { renderUpcomingCard(); return; }
  reindexSeq(SELECTED);
  const runs = ALL_RUNS.filter(r => r.member === SELECTED).slice().reverse(); // newest first
  if (!runs.length) { runListEl.innerHTML = '<div class="run-empty">no runs recorded yet</div>'; return; }
  const merged = mergeRunIdPairs(runs);

  // Collapse consecutive identical (status, outcome) runs same as before -- a fanout finding
  // nothing 5x is one fact, not 5 rows.
  const groups = [];
  for (const r of merged) {
    const key = `${r.status || ''}|${r.outcome || ''}`;
    const last = groups[groups.length - 1];
    if (last && last.key === key) { last.count++; last.rec = r; /* keep newest of the group */ }
    else groups.push({ key, count: 1, rec: r });
  }
  runListEl.innerHTML = groups.map(g => {
    const live = g.rec.status === 'started';
    return `<div class="run-row${live ? ' live' : ''}" data-run-id="${esc(g.rec.run_id || '')}">${runRowHtml(g.rec, g.count, live)}</div>`;
  }).join('');
  restoreOpenTranscript();
}

// One ticking interval updates every visible live row's elapsed text in place -- re-querying
// the DOM each second rather than tracking per-row timers means a row that gets replaced by
// its completion (renderRunList rebuild on the next 'run' SSE event) just stops being found
// here; there is no separate timer handle to leak or clear.
function tickLiveTimers() {
  runListEl.querySelectorAll('.relapsed').forEach(el => {
    const startTs = parseFloat(el.dataset.startTs);
    if (!startTs) return;
    el.textContent = 'running ' + fmtElapsed(startTs);
  });
}
setInterval(tickLiveTimers, 1000);

  const rec = ALL_RUNS.slice().reverse().find(r => r.run_id === row.dataset.runId)

// Home page (gh#560): the console's default landing page. Reif, opening the real console for
// the first time: the number this fleet exists to move appeared nowhere on the first screen.
// Renders the venture's number (already fetched by renderTheNumberTile() for the topbar --
// reused here via NUMBER_DATA rather than a second /api/number call) plus three fleet-health
// tiles: alive (newest ok run, any agent), waiting on human (gh#340's needs_human_op, already
// polled), merged in the last 24h (derived from the existing GH.merged feed). No new backend
// endpoint -- every figure here already exists in state fetched for another page.
// ---------------------------------------------------------------------------------------------
function numberBlockHtml(data) {
  if (!data || !data.configured) {
    return `<div class="kpi-value">unavailable</div><div class="kpi-sub">no number configured for this instance</div>`;
  }
  if (!data.present) {
    return `<div class="kpi-value">unmeasured</div><div class="kpi-sub">not yet read for this instance</div>`;
  }
  const n = data.payload && data.payload.number;
  if (!n) {
    return `<div class="kpi-value">unmeasured</div><div class="kpi-sub">the endpoint could not read it</div>`;
  }
  const stale = !!data.stale;
  return `<div class="kpi-value"${stale ? ' style="color:var(--warn);"' : ''}>${esc(numFmt(n.value))} <span style="font-size:14px;color:var(--dimmer);">${esc(n.unit || '')}</span></div>
    <div class="kpi-sub">${esc(n.name || 'Number')}${esc(numDelta(n.delta_7d))}${stale ? ' -- STALE' : ''}</div>`;
}
function newestOkRunAge() {
  let newest = null;
  for (const r of ALL_RUNS) {
    if (r.status !== 'ok') continue;
    const t = typeof r.ts === 'number' ? r.ts : Date.parse(r.ts) / 1000;
    if (Number.isFinite(t) && (newest === null || t > newest)) newest = t;
  }
  return newest;
}
function mergedLast24hCount() {
  const cutoff = Date.now() - 24 * 3600 * 1000;
  return (GH.merged || []).filter(pr => pr.mergedAt && Date.parse(pr.mergedAt) >= cutoff).length;
}
runListEl.addEventListener('click', e => {
  const a = e.target.closest('.home-agent');
  if (a) { selectAgent(a.dataset.agent); return; }
  const n = e.target.closest('.home-nav');

});

  const newest = newestOkRunAge();

    : `<div class="kpi-value">${esc(ago(newest))}</div><div class="kpi-sub">newest ok run, any agent</div>`;

  const nho = GH.needs_human_op || { count: 0, oldest_age_hours: 0 };

    <div class="kpi-sub">${nho.count ? `oldest ${Math.round(nho.oldest_age_hours)}h` : 'none open'}</div>`;

  const mergedHtml = `<div class="kpi-value">${mergedLast24hCount()}</div><div class="kpi-sub">merged, trailing 24h</div>`;

  runListEl.innerHTML = `
    <div class="rail-section" style="padding:16px;">

        <div class="kpi-label">THE NUMBER</div>

        <div class="kpi-cell"><div class="kpi-label">Alive</div>${aliveHtml}</div>
        <div class="kpi-cell"><div class="kpi-label">Waiting on human</div>${nhoHtml}</div>
        <div class="kpi-cell"><div class="kpi-label">Merged, last 24h</div>${mergedHtml}</div>

// Reif, from his phone, 2026-09-07: "look at how unmobile friendly" -- Home showed four
// tiles and then nothing, because the agents and the nav live in a sidebar that is off-screen
// under 700px. Home now carries both inline, on every width: it is the landing page, and a
// landing page that needs a hamburger to go anywhere is not one.
function homeAgentsHtml() {
  if (!SIDEBAR_ORDER) resortSidebar();
  const byName = Object.fromEntries(SPECS.map(m => [m.spec.name, m]));
  const ranked = SIDEBAR_ORDER.map(n => byName[n]).filter(Boolean);
  SPECS.forEach(m => { if (!SIDEBAR_ORDER.includes(m.spec.name)) ranked.push(m); });
  if (!ranked.length) return '';
  const rows = ranked.map(m => {
    const name = m.spec.name;
    const last = lastRunFor(name);
    const enabled = !!m.effective.enabled;
    const off = !enabled && !hasRecentRun(last);
    const cls = off ? 'off' : statusClass(last?.status);
    const k = KPI_BY_MEMBER[name];
    const kpi = (k && k.total !== null && k.total !== undefined && k.unit) ? `${k.total} ${esc(k.unit)}` : '';
    return `<div class="home-agent ${off ? 'disabled-agent' : ''}" data-agent="${esc(name)}">
        <span class="astatus ${cls}"></span>
        <span class="ha-name">${m.spec.emoji ? esc(m.spec.emoji) + ' ' : ''}${esc(name)}</span>
        <span class="ha-meta">${last ? esc(ago(last.ts)) : 'never run'}${kpi ? ' · ' + kpi : ''}</span>
      </div>`;
  }).join('');
  return `<div class="home-section"><div class="kpi-label">Agents</div><div class="home-agents">${rows}</div></div>`;
}

// Queue page (sidebar item): PRs + backlog, now a full page instead of an always-visible rail --
// it's reference material you check, not something that should compete for space every screen.
// ---------------------------------------------------------------------------------------------
// Backlog filter/sort state (gh#193) -- module-level so it survives the SSE-driven re-renders
// renderQueuePage() gets on every 'gh' event, not just the one the operator triggered.
let QUEUE_FILTER = { tier: 'all', text: '' };
const PRIORITY_TIER_LABEL = ['fleet:priority-high', 'fleet:priority-medium', 'fleet:priority-low'];
function issueTier(i) {
  const names = (i.labels || []).map(l => l.name);
  const idx = PRIORITY_TIER_LABEL.findIndex(t => names.includes(t));
  return idx === -1 ? 3 : idx; // unlabeled issues sort after low, but still show under "all"
}

function renderQueuePage() {
  if (PAGE !== 'queue') return;
  const prs = GH.prs || [];
  const issues = GH.issues || [];
  detailHeadEl.innerHTML = `<div class="title-row"><h2>PRs &amp; Backlog</h2></div>`;

  // The filter text input gets rebuilt below along with the rest of the page -- capture focus
  // and cursor position first so a keystroke doesn't visibly steal focus from itself.
  const filterHadFocus = document.activeElement?.id === 'queueFilterText';
  const filterSelStart = filterHadFocus ? document.activeElement.selectionStart : null;

  const prsHtml = prs.map(pr => {
    const cls = pr._rollup === 'green' ? 'checks-green' : pr._rollup === 'failing' ? 'checks-failing' :
      pr._rollup === 'blocked' ? 'checks-blocked' : 'checks-pending';
    return `<div class="rail-row">
      <a href="${esc(pr.url)}" target="_blank">#${pr.number}</a> ${pr.isDraft ? '<span class="rmeta">draft</span>' : ''}
      <div>${esc(pr.title)}</div>
      <div class="rmeta"><span class="${cls}">${esc(pr._rollup)}</span> · ${esc(pr.headRefName)} · ${ago(pr.updatedAt)}</div>
      <div class="actions"><button class="btn small" data-act="close_pr" data-pr="${pr.number}">close</button></div>
    </div>`;
  }).join('') || '<div class="run-empty">no open PRs</div>';

  // Reif-priority epics sort to the top, own section: "outside of everything else in the
  // queue, do this first." gru builds only these while one is open (gru.md step 2); marie
  // never re-ranks or cruft-closes them, and closes one itself once no child work remains
  // (marie.md Part C) -- so this list should normally be empty or short-lived, not a second
  // permanent backlog.
  const isEpic = i => (i.labels || []).some(l => l.name === 'fleet:reif-priority');
  const epics = issues.filter(isEpic);
  const rest = issues.filter(i => !isEpic(i));

  // Default order is priority tier (high -> medium -> low -> unlabeled), not the recency order
  // GH.issues arrives in -- that recency order is exactly what buried 18 high-priority items
  // across 36 unsorted rows in gh#193's evidence. Array.sort is stable, so issues within the
  // same tier keep their incoming (recency) relative order.
  const tierCounts = [0, 0, 0, 0];
  rest.forEach(i => tierCounts[issueTier(i)]++);
  const filterText = QUEUE_FILTER.text.trim().toLowerCase();
  const visible = rest
    .filter(i => QUEUE_FILTER.tier === 'all' || issueTier(i) === QUEUE_FILTER.tier)
    .filter(i => !filterText || i.title.toLowerCase().includes(filterText))
    .slice()
    .sort((a, b) => issueTier(a) - issueTier(b));

  const renderIssueRow = i => {
    const labels = (i.labels || []).map(l =>
      `<span class="tag" style="--tag-color:#${esc(l.color || '888')}">${esc(l.name)}</span>`).join('');
    return `<div class="rail-row">
      <a href="${REPO_URL ? REPO_URL + '/issues/' + i.number : '#'}" target="_blank">#${i.number}</a>
      <div>${esc(i.title)}</div>
      ${labels ? `<div class="tag-row">${labels}</div>` : ''}
      <div class="rmeta">${i._claimed ? 'claimed' : 'open'} · ${ago(i.updatedAt)}</div>
      <div class="actions">
        ${i._claimed ? `<button class="btn small" data-act="prune" data-issue="${i.number}">release</button>` : ''}
        <button class="btn small" data-act="comment_issue" data-issue="${i.number}">comment</button>
        <button class="btn small" data-act="close_issue" data-issue="${i.number}">close</button>
      </div>
    </div>`;
  };
  const epicsHtml = epics.map(renderIssueRow).join('');
  const issuesHtml = visible.map(renderIssueRow).join('') ||
    `<div class="run-empty">${rest.length ? 'no backlog items match this filter' : 'backlog empty'}</div>`;

  const tierBtn = (tier, label) => `<button data-tier="${tier}" class="${QUEUE_FILTER.tier === tier ? 'active' : ''}">
      ${label} <span class="count-badge">${tier === 'all' ? rest.length : tierCounts[tier]}</span></button>`;
  const filterBarHtml = `
    <div class="queue-filter-bar">
      <div class="hist-toggle" id="queueTierFilter">
        ${tierBtn('all', 'all')}${tierBtn(0, 'high')}${tierBtn(1, 'medium')}${tierBtn(2, 'low')}
      </div>
      <input type="search" id="queueFilterText" placeholder="filter by title…" value="${esc(QUEUE_FILTER.text)}">
    </div>`;

  runListEl.innerHTML = `
    <div class="rail-section">
      <div class="rail-head">Open PRs <span class="count-badge">${prs.length}</span></div>
      ${prsHtml}
    </div>
    ${epics.length ? `
    <div class="rail-section" style="border-color:#b60205">
      <div class="rail-head">🔥 Priority <span class="count-badge">${epics.length}</span></div>
      ${epicsHtml}
    </div>` : ''}
    <div class="rail-section">
      <div class="rail-head">Backlog <span class="count-badge">${visible.length}${visible.length !== rest.length ? '/' + rest.length : ''}</span>
        <button class="btn small" id="newPriority" style="margin-left:auto">🔥 priority</button>
        <button class="btn small" id="newIssue">+ new</button></div>
      ${filterBarHtml}
      ${issuesHtml}
    </div>`;

  document.getElementById('queueTierFilter')?.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const t = btn.dataset.tier;
    QUEUE_FILTER.tier = t === 'all' ? 'all' : Number(t);
    renderQueuePage();
  });
  const filterInput = document.getElementById('queueFilterText');
  filterInput?.addEventListener('input', () => {
    QUEUE_FILTER.text = filterInput.value;
    renderQueuePage();
  });
  if (filterHadFocus && filterInput) {
    filterInput.focus();
    filterInput.setSelectionRange(filterSelStart, filterSelStart);
  }

  document.getElementById('newIssue')?.addEventListener('click', async () => {
    const title = prompt('issue title:');
    if (!title) return;
    const lane = prompt('lane label (e.g. devops, ui, fleet) — optional:', '');
    const body = prompt('body — optional:', '');
    const r = await fetch('/api/create_issue', { method: 'POST', body: JSON.stringify({ title, lane, body }) });
    alert((await r.json()).ok ? 'filed' : 'failed — see server log');
  });
  document.getElementById('newPriority')?.addEventListener('click', async () => {
    const title = prompt('what do you want the fleet to build first, above everything else?');
    if (!title) return;
    const body = prompt('any detail/acceptance criteria — optional:', '');
    const r = await fetch('/api/priority_epic', { method: 'POST', body: JSON.stringify({ title, body }) });
    alert((await r.json()).ok
      ? 'filed as top priority — gru builds this before the rest of the backlog until it\'s done'
      : 'failed — see server log');
  });
}

// ---------------------------------------------------------------------------------------------
// Stats page: recent runs as a timeline, token usage over time, backlog size over time. Three
// Chart.js charts (Reif, 2026-08-25: "dont handroll, pick a nice graph element") reading the
// three /api/stats/* endpoints fleet_stats.py aggregates server-side -- this function only
// shapes the already-aggregated JSON into Chart.js's dataset format, no math of its own.
// Chart instances are destroyed and recreated on every render (not updated in place) -- this
// page is visited rarely compared to the live agent view, so the simplicity of "always start
// clean" outweighs the small cost of a full chart teardown/rebuild.
// ---------------------------------------------------------------------------------------------
let STATS_CHARTS = {}; // chart-id -> Chart instance, so re-renders can destroy before recreate

function destroyStatsChart(id) {
  STATS_CHARTS[id]?.destroy();
  delete STATS_CHARTS[id];
}

async function renderStatsPage() {
  if (PAGE !== 'stats') return;
  detailHeadEl.innerHTML = `<div class="title-row"><h2>Stats</h2></div>`;
  runListEl.innerHTML = `
    <div class="stats-page">
      <div class="stats-card">
        <h3>Magikarp Score</h3>
        <div class="stats-sub">an LLM reads the fleet's own week and scores it, every 3h -- 100 = Jarvis, 1 = a Windows update notification. Splash does nothing... yet.</div>
        <div id="selfImproveCard"></div>
        <canvas id="chartSelfImprove" style="margin-top:10px;"></canvas>
      </div>
      <div class="stats-card">
        <h3>Recent Runs</h3>
        <div class="stats-sub">every run in the last 24h -- is the fleet's output any good</div>
        <div id="runsKpiRow" class="runs-kpi-row"></div>
        <div class="stats-sub" style="margin-top:14px;">Runs per hour by outcome</div>
        <canvas id="chartRunsHourly"></canvas>
        <div class="stats-sub" style="margin-top:14px;display:flex;align-items:center;gap:8px;">
          <img id="minionGif" width="42" height="29" alt="" style="image-rendering:auto;">
          <span>Minions spawned per hour &mdash; the fleet's build throughput</span>
        </div>
        <canvas id="chartMinions"></canvas>
      </div>
      <div class="stats-card">
        <h3>Token Usage</h3>
        <div class="stats-sub">input + output tokens per hour, last 24h</div>
        <canvas id="chartTokens"></canvas>
      </div>
      <div class="stats-card">
        <h3>Backlog Size</h3>
        <div class="stats-sub">backlog total, new PRs, shipped PRs -- per day, last 14 days</div>
        <canvas id="chartBacklog"></canvas>
      </div>
    </div>`;

  if (typeof Chart === 'undefined') {
    runListEl.querySelector('.stats-page').innerHTML =
      '<div class="run-empty">Chart.js failed to load (CDN unreachable?) -- stats unavailable</div>';
    return;
  }

  const [selfImprove, runsSummary, tokensData, backlogData] = await Promise.all([
    fetch('/api/stats/self_improve_score?days=14').then(r => r.json()).catch(() => null),
    fetch('/api/stats/runs_summary?hours=24').then(r => r.json()).catch(() => null),
    fetch('/api/stats/token_usage?hours=24').then(r => r.json()).catch(() => ({ buckets: [] })),
    fetch('/api/stats/backlog_history?days=14').then(r => r.json()).catch(() => ({ days: [], new_prs: [], merged_prs: [] })),
  ]);
  if (PAGE !== 'stats') return; // navigated away while awaiting -- don't render into a gone canvas

  destroyStatsChart('selfImprove');
  destroyStatsChart('runsHourly'); destroyStatsChart('minions');
  destroyStatsChart('tokens'); destroyStatsChart('backlog');

  // --- Magikarp Score: LLM judgment every 3h (self_improve_score.sh, cron on dino), this
  // page only renders what's already scored -- no scoring logic here.
  //
  // The fish is drawn inline rather than fetched: an ORIGINAL stylized carp, not Nintendo's
  // sprite -- same joke, no copyrighted artwork shipped in the repo, and no external asset to
  // 404 later. It reacts to the score, which is the whole point of the name: a low score is a
  // fish that only knows Splash, and the thing about Magikarp is it does eventually evolve.
  const siCard = document.getElementById('selfImproveCard');
  const siHistory = selfImprove?.history || [];
  const siLatest = selfImprove?.latest;

  // The real Magikarp (Gen-3 front sprite, 96x96, 832 bytes). Embedded as a data URI, not
  // linked: the dashboard is served under a CSP that blocks external hosts, so a remote
  // <img src> would silently render nothing. Attribution is on the card itself -- Magikarp is
  // Nintendo/Creatures/Game Freak's, and this dashboard is internal.
  const KARP_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgBAMAAAAQtmoLAAAAMFBMVEUAAAAAAABSUmJ7YlKDAEGLi6S9IFK9QUHFrHPNzdX2Yhj/nGL/3in/5sX/7qT///+A0hpoAAAAAXRSTlMAQObYZgAAAr5JREFUWMPt1jFIG1EYAOALFxwlDy0BrdhKS8kUIR0yyGHKYdrcIoUMncQSIigO1aM/poOKS4bSQXC4Lkf0SMrbLJLh3iQOlZKxqyA4NEMQFCTj63+X4Hjvj9ChND8hXML/8f//e4+707RhDGMY/1bogwJj9q+Dq4eDMmnm686slgkvRzx1egbB9ay+G/5YnSf0k0Fwlu2BwgwBtLMIqiGIg1wkTND+3GpVw5WNbcg7QolOC0EiuExuyAM1eIz5532QpoDYPYhD+o4wRAxHKJvmAl6BSwFaubQgmsI353HmJflEmR8XornWLBV4nW3kpgnAEihWuVfgnAkSgE+Ce5zX66aoSQJYEYJzXuCeJd6/kvKtKn9ECB+B51nNGXkr5a0KrAm/UUFgNVNS4kfZ05rg210E/nNX7m+5UnWasKOGlBVufXdc58YuYolFBfARfOWTh86Bm7Sd4pICBCPI6S6fTDlLMglbzl2xqNi2oELXE6kDiSDvuNHrFA82wZXdmp96J+ULSJoOAWwj4LhI8hkwMN/sR57tYNcastKoPHKKzi0kGIAZdeuINcu4zYBHo4Yt3UBCYwzsqFVdvyjxbx1EfBq34GnwH2MRYP3iQhS4EYjDdB9ExtQvU5zwI+Mnig9p9cnTJnNsXEzwIyzRgFxkM/2hPzJmTXBuYD7k8wn1HWB8mVnHCH4ArqdNuNfHclA6Adj8DWDnlwlg1ARbJGGzg/kLCQp4mQ8AGGYemEYCJ5Y/bpoGjlAlVdixxPGKjRVeV3sPCVVcxdh8PDfWqQZBKdF7gurtEFBKtHugcx7kU0qMhg8rY651vlfdHaOAnT5onWb3SO8B4RCGjkCngbAnBHOn/dcBSgn9Uj/Vz6jvJlhCv9QSGvklCMdGMEhcPQB8GRBoxiD5o7j82UF6auPyDNRT5v5rGMMYxn8QfwBD8VbGQHft5AAAAABJRU5ErkJggg==';
  function magikarpArt(score) {
    // Below 33 it flops (Splash). 33-65 it's stirring. 66+ it has earned the glow.
    const flop = score < 33, evolving = score >= 66;
    return `
      <div style="position:relative;flex:none;width:112px;height:96px;display:flex;align-items:center;justify-content:center;">
        ${evolving ? `<div style="position:absolute;inset:0;background:radial-gradient(circle,rgba(255,215,94,.35),transparent 68%);"></div>` : ''}
        <img src="${KARP_PNG}" width="96" height="96" alt="Magikarp, the fleet's self-improvement mascot, scoring ${score} out of 100"
             style="position:relative;image-rendering:pixelated;${flop ? 'animation:karpFlop 1.6s ease-in-out infinite;' : ''}${evolving ? '' : score < 33 ? 'filter:saturate(.85);' : ''}">
      </div>`;
  }

  // Cron cadence is 3h; anything older than 2 missed runs reads as "stopped", not "lagging" --
  // gh#141: the empty-state copy below used to render identically whether the pipeline was
  // minutes old or had never run at all. `latest` now always carries the true last-ever score
  // (see the server's days-window comment), so a genuinely stale-but-real score and a
  // never-written one are distinguishable here instead of both falling through to one string.
  const SI_CADENCE_MS = 3 * 3600 * 1000;
  const siStaleMs = siLatest ? Date.now() - Date.parse(siLatest.date) : null;
  const siStale = siStaleMs !== null && siStaleMs > SI_CADENCE_MS * 2;

  if (siCard) {
    if (!siLatest) {
      siCard.innerHTML = '<div class="run-empty">no score yet -- self_improve_score.sh runs every 3h</div>';
    } else {
      const color = siLatest.score >= 66 ? '#1f8b4c' : siLatest.score >= 33 ? '#a6720f' : '#c13a2e';
      const quip = siLatest.score < 33 ? 'still just Splash'
                 : siLatest.score < 66 ? 'gaining XP'
                 : 'evolution imminent';
      // Every pass's own reasoning, newest first. The score swings hard between passes (22 ->
      // 42 -> 22 in one morning is real, observed data) and the ONLY thing that explains a
      // swing is what that pass actually argued -- showing just the latest score hides the
      // disagreement, which is the most interesting signal on the card. The data was already
      // in /api/stats/self_improve_score's history; the UI simply threw it away.
      const siPasses = siHistory.slice().reverse();
      // The newest pass is already rendered in full on the card above -- repeating it as the
      // first row made the panel read as one long duplicated wall of text.
      const passRows = siPasses.map((h, i) => {
        if (i === 0) return '';
        const c = h.score >= 66 ? '#1f8b4c' : h.score >= 33 ? '#a6720f' : '#c13a2e';
        const prev = siPasses[i + 1];
        const delta = prev ? h.score - prev.score : null;
        const arrow = delta === null || delta === 0 ? ''
          : `<span style="color:${delta > 0 ? '#1f8b4c' : '#c13a2e'};font-weight:600;">${delta > 0 ? '+' : ''}${delta}</span>`;
        // An unchanged score whose reasoning is byte-identical to the pass below it argued
        // nothing new. Render the number, skip the expander -- an expander that opens onto a
        // repeat is worse than no expander.
        const same = prev && (h.reasoning || '') === (prev.reasoning || '');
        if (same) {
          return `
            <div style="border-top:1px solid var(--line);padding:8px 0;display:flex;align-items:baseline;gap:10px;">
              <span style="font-weight:700;color:${c};min-width:34px;">${h.score}</span>
              <span style="min-width:34px;font-size:12px;">${arrow}</span>
              <span style="color:var(--dimmer);font-size:12px;">${esc(humanDate(h.date))}</span>
              <span style="color:var(--dimmer);font-size:12px;">&middot; unchanged</span>
            </div>`;
        }
        return `
          <details style="border-top:1px solid var(--line);padding:8px 0;">
            <summary style="cursor:pointer;display:flex;align-items:baseline;gap:10px;list-style:none;">
              <span style="font-weight:700;color:${c};min-width:34px;">${h.score}</span>
              <span style="min-width:34px;font-size:12px;">${arrow}</span>
              <span style="color:var(--dimmer);font-size:12px;">${esc(humanDate(h.date))}</span>
            </summary>
            <div class="kpi-sub" style="margin:6px 0 2px 44px;white-space:pre-wrap;">${esc(h.reasoning || '(no reasoning recorded)')}</div>
          </details>`;
      }).join('');

      // Same delta convention as passRows, but against siPasses[1] (the previous pass) --
      // the headline is siPasses[0], so this is the identical i===0 case passRows skips.
      const headlineDelta = siPasses[1] ? siLatest.score - siPasses[1].score : null;
      const headlineArrow = headlineDelta === null || headlineDelta === 0 ? ''
        : `<span style="color:${headlineDelta > 0 ? '#1f8b4c' : '#c13a2e'};font-weight:600;font-size:14px;margin-left:8px;">${headlineDelta > 0 ? '+' : ''}${headlineDelta}</span>`;

      const staleBadge = siStale
        ? `<span class="badge quiet" title="expected every 3h -- last score ${esc(ago(siLatest.date))}, this may have stopped running">stale</span>`
        : '';
      siCard.innerHTML = `
        <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
          ${magikarpArt(siLatest.score)}
          <div class="kpi-cell" style="flex:1;min-width:240px;">
            <div class="kpi-label">${esc(humanDate(siLatest.date))} &middot; ${quip} ${staleBadge}</div>
            <div class="kpi-value" style="color:${color};">${siLatest.score}<span style="font-size:14px;color:var(--dimmer);">/100</span>${headlineArrow}</div>
            <div class="kpi-sub">${esc(siLatest.reasoning || '')}</div>
            ${siStale ? `<div class="kpi-sub" style="color:var(--warn);">last score ${esc(ago(siLatest.date))} -- expected every 3h, this pipeline may have stopped</div>` : ''}
          </div>
        </div>
        <div style="margin-top:14px;">
          <div class="kpi-label" style="margin-bottom:2px;">every pass &middot; ${siPasses.length - 1} scored</div>
          ${passRows}
        </div>
        <div style="margin-top:12px;font-size:11px;color:var(--dimmer);">
          Magikarp &copy; Nintendo / Creatures / Game Freak (sprite via PokeAPI). Minions &copy; Universal / Illumination. Used for internal fleet monitoring only.
        </div>`;
    }
  }
  if (siHistory.length) {
    // Rows written before the 3h switch carry a bare "2026-08-25"; newer ones a full ISO
    // timestamp. Render the timestamps as "08-25 18h" -- a raw 20-char ISO string per point
    // is unreadable on the x-axis once there are eight of them a day.
    const karpLabel = s => humanDate(s);
    STATS_CHARTS.selfImprove = new Chart(document.getElementById('chartSelfImprove'), {
      type: 'line',
      data: {
        labels: siHistory.map(d => karpLabel(d.date)),
        datasets: [{
          label: 'magikarp score', data: siHistory.map(d => d.score),
          borderColor: '#2166c4', backgroundColor: 'rgba(33,102,196,.08)',
          fill: true, tension: 0.2, pointRadius: 2,
        }],
      },
      options: {
        responsive: true,
        scales: { y: { min: 0, max: 100, grid: { color: '#eef0f3' } }, x: { grid: { display: false } } },
        plugins: { legend: { display: false } },
      },
      // Same annotation-not-a-dataset pattern the minion/outcome charts use. A 1-100 line
      // that lives entirely in the 18-42 band is unreadable against a 0-100 axis without
      // them: every point looks like "about 20-ish" when the actual swing (22 -> 42 -> 22 in
      // one morning) is the most interesting thing on the chart.
      plugins: [{
        id: 'karpValues',
        afterDatasetsDraw(chart) {
          const { ctx } = chart, meta = chart.getDatasetMeta(0);
          if (!meta || !meta.data) return;
          ctx.save();
          ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, monospace';
          ctx.fillStyle = '#6b7280'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          meta.data.forEach((pt, i) => {
            const v = chart.data.datasets[0].data[i];
            if (v != null) ctx.fillText(String(v), pt.x, pt.y - 6);
          });
          ctx.restore();
        },
      }],
    });
  }

  // --- Recent Runs: KPI strip + hourly outcome bar + per-agent signal rate. Replaces the old
  // per-run scatter (when did each agent run -- nobody asked) with "is the fleet's output any
  // good" -- signal rate (ok / executed), budget-wall rate (declined before running / total),
  // total runs, and which agents are fully walled off (dormant).
  const STATUS_COLOR = { ok: '#1f8b4c', quiet: '#a6720f', reported_nothing: '#c13a2e', budget_declined: '#9a9ea6' };
  // gh#153: `null` (not `0`) is the "no data" sentinel for these two -- a real 0% (everyone
  // failed, or everyone got budget-walled) is a different diagnosis from "nothing ran in this
  // window," and pctOrDash below is what keeps the two from rendering as the same digit.
  const rs = runsSummary || { signal_rate: null, executed: 0, total: 0, budget_wall: null, declined: 0,
                               budget_declined_count: 0, interrupted_count: 0,
                               dormant: [], hourly: [], statuses: [], agent_rates: [] };
  const pctOrDash = v => (v === null || v === undefined) ? '—' : v + '%';
  const kpiRow = document.getElementById('runsKpiRow');
  if (kpiRow) {
    kpiRow.innerHTML = `
      <div class="kpi-cell">
        <div class="kpi-label">Signal rate</div>
        <div class="kpi-value">${pctOrDash(rs.signal_rate)}</div>
        <div class="kpi-sub">${rs.executed} of ${rs.total} executed</div>
      </div>
      <div class="kpi-cell">
        <div class="kpi-label">Budget wall</div>
        <div class="kpi-value">${pctOrDash(rs.budget_wall)}</div>
        <div class="kpi-sub">${rs.budget_declined_count} declined, ${rs.interrupted_count} interrupted</div>
      </div>
      <div class="kpi-cell">
        <div class="kpi-label">Total runs</div>
        <div class="kpi-value">${rs.total}</div>
        <div class="kpi-sub">${rs.agent_rates.length + rs.dormant.length} agents, 24h</div>
      </div>
      <div class="kpi-cell">
        <div class="kpi-label">Dormant</div>
        <div class="kpi-value">${rs.dormant.length}</div>
        <div class="kpi-sub">${rs.dormant.join(', ') || 'none'}</div>
      </div>`;
  }

  STATS_CHARTS.runsHourly = new Chart(document.getElementById('chartRunsHourly'), {
    type: 'bar',
    data: {
      labels: rs.hourly.map(h => new Date(h.ts * 1000)),
      datasets: rs.statuses.map(status => ({
        label: status, data: rs.hourly.map(h => h[status] || 0),
        backgroundColor: STATUS_COLOR[status] || '#8a8f98',
      })),
    },
    options: {
      responsive: true,
      scales: {
        x: { type: 'time', time: { unit: 'hour' }, stacked: true, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, grid: { color: '#eef0f3' } },
      },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10.5 } } },
      },
    },
    // Total above each column. The bars are stacked by outcome, so the one number a human
    // actually wants -- how many runs happened that hour -- was the one number the chart
    // never showed: you had to eyeball the top of the stack against the y-axis.
    //
    // Drawn in afterDatasetsDraw rather than added as a dataset: a total is an annotation ON
    // the stack, not another series in it -- as data it would inflate the stack it describes.
    plugins: [{
      id: 'hourlyTotals',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta0 = chart.getDatasetMeta(0);
        if (!meta0 || !meta0.data) return;
        ctx.save();
        ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillStyle = '#6b7280';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta0.data.forEach((bar, i) => {
          let total = 0, topY = Infinity;
          chart.data.datasets.forEach((ds, di) => {
            const dm = chart.getDatasetMeta(di);
            if (dm.hidden) return;              // respect legend toggles
            total += Number(ds.data[i]) || 0;
            const el = dm.data[i];
            if (el && el.y < topY) topY = el.y;
          });
          if (total > 0 && isFinite(topY)) ctx.fillText(String(total), bar.x, topY - 3);
        });
        ctx.restore();
      },
    }],
  });

  // Minions are Illumination/Universal's; this dashboard is internal and credits them below.
  // Inlined as a data URI for the same reason the Magikarp sprite is: the page's CSP blocks
  // external hosts, so a remote src renders nothing. Downscaled to 84x57 and every 4th frame
