  // the fleet actually BUILDING" -- the stacked chart counts all nine members together and
  // buries it. Zero-hours are explicit in the data, not gaps: a 0 means gru ran and chose to
  // spawn nothing, which is different from no data.
  const mh = rs.minions_hourly || [];
  STATS_CHARTS.minions = new Chart(document.getElementById('chartMinions'), {
    type: 'bar',
    data: {
      labels: mh.map(h => new Date(h.ts * 1000)),
      datasets: [{ label: 'minions spawned', data: mh.map(h => h.count), backgroundColor: '#f5c518' }],
    },
    options: {
      responsive: true,
      scales: {
        x: { type: 'time', time: { unit: 'hour' }, grid: { display: false } },
        y: { beginAtZero: true, grid: { color: '#eef0f3' }, ticks: { precision: 0 } },
      },
      plugins: { legend: { display: false } },
    },
    plugins: [{
      id: 'minionTotals',
      afterDatasetsDraw(chart) {
        const { ctx } = chart, meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data) return;
        ctx.save();
        ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillStyle = '#6b7280'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          const v = Number(chart.data.datasets[0].data[i]) || 0;
          if (v > 0) ctx.fillText(String(v), bar.x, bar.y - 3);
        });
        ctx.restore();
      },
    }],
  });


  // --- Token Usage: stacked bar, input vs output, per hour
  const buckets = tokensData.buckets || [];
  STATS_CHARTS.tokens = new Chart(document.getElementById('chartTokens'), {
    type: 'bar',
    data: {
      labels: buckets.map(b => new Date(b.ts * 1000)),
      datasets: [
        { label: 'input', data: buckets.map(b => b.input_tokens), backgroundColor: '#9a9ea6' },
        { label: 'output', data: buckets.map(b => b.output_tokens), backgroundColor: '#2166c4' },
      ],
    },
    options: {
      responsive: true,
      scales: {
        x: { type: 'time', time: { unit: 'hour' }, stacked: true, grid: { display: false } },
        y: { stacked: true, grid: { color: '#eef0f3' } },
      },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10.5 } } } },
    },
  });

  // --- Backlog Size: all three as bars, per Reif's "more readable" -- backlog total gets its
  // own right-hand y-axis (0-400ish) since it dwarfs new/shipped PR counts (0-100ish); on one
  // shared axis the backlog bars swamp the PR bars to invisibility. Same day-keyed x-axis, all
  // three arrays day-aligned by the server already (backlog_history / pr_activity_by_day).
  const days = backlogData.days || [];
  const newPrDays = backlogData.new_prs || [];
  const mergedPrDays = backlogData.merged_prs || [];
  STATS_CHARTS.backlog = new Chart(document.getElementById('chartBacklog'), {
    type: 'bar',
    data: {
      labels: days.map(d => humanDate(d.date, { dayOnly: true })),
      datasets: [
        {
          label: 'backlog total', data: days.map(d => d.count),
          backgroundColor: 'rgba(33,102,196,.55)', yAxisID: 'yBacklog', order: 1,
        },
        {
          label: 'new PRs', data: newPrDays.map(d => d.count),
          backgroundColor: 'rgba(166,114,15,.65)', yAxisID: 'yPrs', order: 2,
        },
        {
          label: 'shipped PRs', data: mergedPrDays.map(d => d.count),
          backgroundColor: 'rgba(31,139,76,.65)', yAxisID: 'yPrs', order: 3,
        },
      ],
    },
    options: {
      responsive: true,
      scales: {
        x: { grid: { display: false } },
        yBacklog: { beginAtZero: true, position: 'left', grid: { color: '#eef0f3' },
          title: { display: true, text: 'backlog total', font: { size: 10.5 } } },
        yPrs: { beginAtZero: true, position: 'right', grid: { display: false },
          title: { display: true, text: 'PRs/day', font: { size: 10.5 } } },
      },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10.5 } } } },
    },
  });
}

// ---------------------------------------------------------------------------------------------
// Settings page (sidebar item): the fleet-wide master toggle -- pulled out of the topbar so the
// topbar stays a status strip, not a place with a destructive action one misclick away.
// ---------------------------------------------------------------------------------------------
// DIAL_FIELDS mirrors fleet_view_server.py's own list -- purely a label lookup for the
// inputs below; the server re-validates against its own copy on write, this is not the
// security boundary.
// [env key, label, hint]. Labels used to be the variable name with the underscores taken
// out, which said nothing about what the number does. Reif, 2026-09-03: "I dont know what
// these things mean" and "define it, and show me why I would change it".
//
// FIVE DIALS WERE REMOVED HERE BECAUSE NOTHING READS THEM. FLEET_CADENCE_BUILD,
// FLEET_CADENCE_REVIEW, FLEET_CADENCE_GITPULL, FLEET_CADENCE_RANK/CEO and FLEET_QUEUE_CAP
// have ZERO readers anywhere in this kit -- verified by grepping scripts/, members/,
// entrypoint.sh, up.sh and the Dockerfile. They are leftovers from the target repo's older
// `scripts/mac/gru_builder_fanout.sh` (which reads MBUILD_QUEUE_CAP, a different variable
// entirely). An operator could type a value, hit Save, watch it persist, and change nothing:
// authority written down and ignored, the exact failure class run_member.sh's own header
// says this kit exists to end. A member's real schedule lives in its spec
// (members/<name>/<name>.fleet.json "schedule"), which is what the agent page already shows
// as schedule={"hourly_at_minute":12}.
// Reif, 2026-09-07, on the share picker: "where is .3, etc. and show them as percents". Every
// 5% from 5% to 100%, labelled as a percent; the stored value stays the fraction the scripts
// read (0.3), only the label changes.
const PCT_STEPS = Array.from({length: 20}, (_, i) => String((i + 1) / 20));
const PCT_LABELS = Object.fromEntries(PCT_STEPS.map(v => [v, `${Math.round(Number(v) * 100)}%`]));
const DIAL_FIELDS = [
  ['FLEET_SHARE_FRACTION', 'Fleet budget share',
   "How much of this account's hourly headroom this whole instance may use. Turn it DOWN when another instance shares the account, or when you want the week to last; UP to spend budget that would otherwise expire unused at week reset.",
   PCT_STEPS, {labels: PCT_LABELS}],
  ['FLEET_GRU_ALLOWANCE_FRACTION', "Gru's cut of that share",
   'Of the share above, how much gru may spend spawning minions. Multiplies: a 90% share with a 90% cut is 81% of headroom. Turn it UP for more minions per pass and faster backlog burn; DOWN if marie, jefe, roomba or sentry start reporting budget_declined -- they draw from what is left.',
   PCT_STEPS, {labels: PCT_LABELS}],
  ['FLEET_GRU_CADENCE', 'How often gru runs (cron hour)',
   'Which hour(s) gru wakes to claim work and spawn minions (minute is a hardcoded :03). Blank = every hour. This dial actually sets the cron HOUR field (entrypoint.sh), so only hour-valid values belong here -- see gh#347/gh#380 before adding more presets.',
   ['', '*/2', '3'], {labels: {'': 'once an hour (default)', '*/2': 'every 2 hours', '3': 'once a day, at 03:03 UTC'}, allowCustom: true}],
  ['FLEET_DATTA_MAX_NERDS_PER_PASS', 'Max nerds datta spawns per pass',
   "Flat cap on how many nerds datta spawns in one hourly pass, one per qualifying lane up to this number. gh#390: datta's charter always said to bound this off 'the hour's allowance' but no such dial existed, so every pass improvised a judgment call. Turn it UP to cover more lanes per hour; DOWN if datta is competing with gru/marie for budget.",
   ['1', '2', '3', '4', '5'], {allowCustom: true}],
  ['FLEET_BUILDER_MODEL', 'Model minions build with',
   'sonnet is the default and right for almost all backlog work. opus costs several times more per pass -- worth it only for genuinely hard reasoning, and it will empty the budget faster.',
   ['sonnet', 'opus', 'haiku']],
  ['FLEET_CODE_REVIEW_MODEL', 'Model that reviews PRs',
   'The reviewer reads diffs and blocks bad merges. Raising this to opus catches more, and costs more, on every single PR.',
   ['sonnet', 'opus', 'haiku']],
  ['FLEET_MAX_BUDGET_USD', 'Hard spend cap per pass (USD)',
   'One pass is killed outright above this. A real stop, not a pace target -- at $5 it binds long before the fractions above do, so raise it first if passes are dying mid-work.',
   ['1', '2', '5', '10', '20', '50'], {labels: {'1': '$1', '2': '$2', '5': '$5', '10': '$10', '20': '$20', '50': '$50'}, allowCustom: true}],
];

function renderSettingsPage() {
  if (PAGE !== 'settings') return;
  detailHeadEl.innerHTML = `<div class="title-row"><h2>Settings</h2></div>`;
  const on = !!FLEET_STATE.FLEET_ENABLED;
  // PICKERS, NOT FREE TEXT. Every dial here has either a closed set of valid values or a
  // small set of sane ones, and free text on any of them fails silently:
  //   - the model fields feed straight into `claude --model "$MODEL"`
  //     (worktree_builder.sh:28, judge-judy.sh:52) with NO validation anywhere in the kit,
  //     so a typo like "sonet" saves cleanly, looks right here, and then fails every build
  //     pass at the API with nothing on this page to suggest why
  //   - the fractions are 0-1, where typing 9 instead of 0.9 is one keystroke and means
  //     something wildly different (it clamps, so it also does not error)
  //   - the spend cap is dollars, where a stray zero is a 10x change to a hard kill switch
  // The two dials whose valid values are not enumerable (gru's cron field, the cap) keep an
  // "other..." escape that swaps in a text box, so the picker never blocks a real value.
  const dialRows = DIAL_FIELDS.map(([key, label, hint, options, opts]) => {
    let cur = FLEET_STATE[key] || '';
    const o = opts || {};
    // "0.20" in fleet.env and "0.2" in the list are the same dial setting; match by value so
    // a stored fraction written with a trailing zero is not flagged as "not a listed value".
    if (options && cur && !options.includes(cur) && Number.isFinite(Number(cur))) {
      const same = options.find(v => Number(v) === Number(cur));
      if (same !== undefined) cur = same;
    }
    const labels = o.labels || {};
    const box = 'display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:5px 7px;'
      + 'background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);'
      + 'font-family:inherit;font-size:12.5px';
    let field;
    if (options) {
      // A stored value outside the list is KEPT and shown, never silently rewritten to a
      // default -- that would hide a real misconfiguration behind a healthy-looking page.
      const known = options.includes(cur);
      const list = known || !cur ? options.slice() : options.concat([cur]);
      const optsHtml = list.map(v => {
        const text = labels[v] !== undefined ? labels[v] : (v === '' ? '(default)' : v);
        const flag = options.includes(v) ? '' : ' \u2014 current, not a listed value';
        return `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(text)}${flag}</option>`;
      }).join('');
      const custom = o.allowCustom
        ? `<option value="__custom__">other...</option>` : '';
      // gh#355: when cur is unset and the option list has no '' entry, no <option> above gets
      // `selected` -- the browser still defaults the rendered <select>.value to the FIRST
      // listed option with no visual flag. data-unset marks that case so saveDials (below)
      // can skip it unless the operator actually touches the control.
      // gh#510: PR#501 (gh#460) added `onclick` here so re-picking the option already sitting
      // at index 0 (which never fires `change`, since the value never actually changes) still
      // counted as touched. But `onclick` fires on every open of the dropdown, including one
      // dismissed (Escape/click-away) without ever picking a value -- reintroducing gh#355's
      // bug (a value the operator never gave gets written) via a different trigger. `change`
      // is a real value commit; only that marks a dial touched. This narrower fix knowingly
      // leaves gh#460's own index-0-reselect edge case unhandled again -- see gh#510 comments.
      const unset = !cur && !options.includes('');
      field = `<select class="dial-input" data-key="${key}"${unset ? ' data-unset="1"' : ''} style="${box}"
        onchange="this.dataset.touched='1';
          if(this.value==='__custom__'){const i=document.createElement('input');
          i.className='dial-input';i.dataset.key='${key}';i.dataset.touched='1';i.value='';
          i.style.cssText='${box}';i.placeholder='type a value';this.replaceWith(i);i.focus();}">${optsHtml}${custom}</select>`;
    } else {
      field = `<input class="dial-input" data-key="${key}" value="${esc(cur)}" style="${box}">`;
    }
    return `
    <label style="display:block;font-size:11.5px;color:var(--dim);margin-top:14px">
      <span style="color:var(--text);font-weight:500">${esc(label)}</span>
      ${field}
      ${hint ? `<span style="display:block;margin-top:3px;font-size:11px;color:var(--dim);
        line-height:1.45">${esc(hint)}</span>` : ''}
    </label>`;
  }).join('');
  runListEl.innerHTML = `
    <div class="settings-block">
      <h3>Fleet</h3>
      <div class="rmeta" style="margin-bottom:8px">repo: ${esc(REPO_URL || '—')}</div>
      <button class="btn ${on ? 'danger' : 'go'}" id="masterToggle">${on ? '■ stop fleet' : '● start fleet'}</button>
    </div>
    <div class="settings-block">
      <h3>Access</h3>
      <div class="rmeta" style="margin-bottom:8px">Changing anything on this page from
        outside the box needs this instance's access key, once per browser. On localhost
        you are already trusted and never need it.</div>
      <input type="password" id="apiKeyInput" placeholder="Paste access key"
        autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other"
        style="width:280px">
      <button class="btn go" id="signIn">Sign in</button>
      <span id="signInMsg" class="rmeta" style="margin-left:10px"></span>
    </div>
    <div class="settings-block">
      <h3>Dials</h3>
      ${dialRows}
      <button class="btn go" id="saveDials" style="margin-top:12px">Save</button>
      <span id="dialsMsg" class="rmeta" style="margin-left:10px"></span>
      <div id="budgetPreview" class="rmeta" style="margin-top:14px; padding:10px 12px;
           border-left:3px solid #888; background:rgba(128,128,128,.08); line-height:1.7;
           font-variant-numeric:tabular-nums">reading meter…</div>
    </div>`;
  window.renderBudgetPreview = async () => {
    const el = document.getElementById('budgetPreview');
    if (!el) return;
    let p;
    try { p = await (await fetch('/api/budget_preview')).json(); }
    catch (e) { el.textContent = 'budget preview unavailable'; return; }
    const esc = t => String(t).replace(/[<&]/g, c => (c === '<' ? '&lt;' : '&amp;'));
    // Show the DERIVATION, not just the answer -- two nested percentages that look
    // independent are exactly what a human mis-tunes, and this dial was silently dead
    // for weeks because the page only ever showed the two raw inputs.
    if (!p.ceiling_pct) {
      el.innerHTML = `<b>Budget</b><br><span style="opacity:.8">${esc(p.note || 'no reading')}</span>`;
      return;
    }
    const pct = v => (v === null || v === undefined) ? '—' : esc(v);
    el.innerHTML =
      `<b>What these dials actually produce</b> <span style="opacity:.7">(percent-of-week units, live)</span><br>` +
      // Name the account these numbers came from. Without it the panel showed a ceiling
      // and an allowance derived from one account's meter while naming no account at all,
      // so tuning the dials gave no way to tell WHICH account they applied to.
      (p.maxx_handle
        ? `<div style="margin-bottom:6px">metering <b>${p.account ? p.account + ' ' : ''}` +
          `@${p.maxx_handle}</b>${p.pool && p.pool.split(/\s+/).length > 1
            ? ` <span style="opacity:.65">(pool: ${p.pool})</span>` : ''}</div>`
        : '') +
      `account hourly headroom &times; <b>${pct(p.share_fraction)}</b> (share) ` +
      `= <b>${pct(p.ceiling_pct)}</b> &larr; this instance's ceiling<br>` +
      `${pct(p.ceiling_pct)} &times; <b>${pct(p.gru_fraction)}</b> (gru) ` +
      `= <b>${pct(p.gru_allowance_pct)}</b> &larr; gru gets this<br>` +
      `<span style="opacity:.8">remaining <b>${pct(p.others_pct)}</b> for the other eight members ` +
      `(marie, jefe, judge-judy, the-fixer, roomba, dumbledore, messenger)</span>` +
      (p.note ? `<br><span style="opacity:.8">${esc(p.note)}</span>` : '');
  };
  renderBudgetPreview();

  document.getElementById('signIn').onclick = async () => {
    const el = document.getElementById('apiKeyInput');
    const msg = document.getElementById('signInMsg');
    const r = await fetch('/api/login', { method: 'POST', body: JSON.stringify({ key: el.value }) });
    const j = await r.json().catch(() => ({}));
    // The key itself is never kept in the page -- the server hands back an HttpOnly cookie
    // and this input is cleared, so a later XSS has nothing to lift.
    el.value = '';
    msg.textContent = j.ok ? '\u2713 signed in -- you can change settings' : (j.error || 'that key was not accepted');
    msg.style.color = j.ok ? 'var(--ok, #1f8b4c)' : 'var(--danger, #c13a2e)';
  };
  document.getElementById('masterToggle').onclick = async () => {
    if (on && !confirm('stop the WHOLE fleet? every member exits on its next tick.')) return;
    await fetch('/api/fleet_toggle', { method: 'POST', body: JSON.stringify({ target: 'fleet', value: !on }) });
    await renderFleetState();
    renderSettingsPage();
  };
  document.getElementById('saveDials').onclick = async () => {
    const body = {};
    runListEl.querySelectorAll('.dial-input').forEach(i => {
      // gh#355: an untouched, unset dial (data-unset, see renderSettingsPage above) reads back
      // the browser's own first-option default -- send it here and Save would silently write
      // that fabricated value into fleet.env even though the operator never chose it. Skip it;
      // any dial the operator actually edits gets data-touched='1' and is still sent normally.
      if (i.dataset.unset === '1' && i.dataset.touched !== '1') return;
      body[i.dataset.key] = i.value;
    });
    const r = await fetch('/api/fleet_settings', { method: 'POST', body: JSON.stringify(body) });
    const resp = await r.json().catch(() => ({}));
    await renderFleetState();
    // A bare "save failed" is what hid this bug for weeks: the server was answering 401
    // "unauthorized" the whole time and the page threw that away. Say which it is.
    // gh#480: a validation failure sends {ok:false, errors:{key: msg}} (plural, a dict) --
    // not the {error: msg} shape the 401 branch below expects -- so surface every pair
    // instead of falling through to the generic string.
    document.getElementById('dialsMsg').textContent = resp.ok
      ? `saved ${resp.written.length} field(s)`
      : (r.status === 401 ? 'not signed in -- paste the access key above first'
        : (resp.errors && Object.keys(resp.errors).length
          ? Object.entries(resp.errors).map(([k, v]) => `${k}: ${v}`).join('; ')
          : 'save failed'));
    // Re-derive immediately: the whole point is that the operator SEES what the new dial did,
    // rather than trusting that a number they typed had the effect they intended.
    if (resp.ok) await renderBudgetPreview();
  };
}

// ---------------------------------------------------------------------------------------------
// Action bar clicks (rerun / enable-disable / dial edit / PR+issue actions) -- one delegated
// listener on body covers detail head + run list + rail.
// ---------------------------------------------------------------------------------------------
document.body.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const act = b.dataset.act;

  if (act === 'run-now') {
    const name = b.dataset.member;
    b.disabled = true; const prevText = b.textContent; b.textContent = 'starting…';
    const r = await fetch('/api/run_now', { method: 'POST', body: JSON.stringify({ member: name }) });
    const j = await r.json();
    b.disabled = false; b.textContent = prevText;
    if (!j.ok) alert(`failed: ${j.error || 'see server log'}`);
    // no alert on success -- the new run appears in the list itself within seconds, that IS the confirmation
    return;
  }
  if (act === 'toggle-member') {
    const willBeOn = b.dataset.on !== 'true';
    await fetch('/api/fleet_toggle', { method: 'POST', body: JSON.stringify({ target: b.dataset.member, value: willBeOn }) });
    await loadMembers(); renderSidebar(); renderDetailHead(); await renderQueue();
    return;
  }
  if (act === 'edit-dial') {
    const key = b.dataset.key;
    const m = SPECS.find(s => s.spec.name === b.dataset.member);
    const current = m ? JSON.stringify(dialValue(m.effective, key)) : undefined;
    const value = prompt(`new value for ${b.dataset.member}.${key} (JSON):`, current);
    if (value === null) return;
    const why = prompt('why? (required)');
    if (!why) return;
    let parsed; try { parsed = JSON.parse(value); } catch { parsed = value; }
    const r = await fetch('/api/steer', { method: 'POST', body: JSON.stringify({ member: b.dataset.member, key, value: parsed, why }) });
    if ((await r.json()).ok) { await loadMembers(); renderDetailHead(); } else alert('failed — see server log');
    return;
  }
  if (act === 'prune') {
    if (!confirm(`release the claim on issue #${b.dataset.issue}?`)) return;
    const r = await fetch('/api/prune', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue }) });
    alert((await r.json()).ok ? 'released' : 'failed — see server log');
  } else if (act === 'close_pr') {
    if (!confirm(`close PR #${b.dataset.pr}?`)) return;
    const r = await fetch('/api/close_pr', { method: 'POST', body: JSON.stringify({ pr: b.dataset.pr }) });
    alert((await r.json()).ok ? 'closed' : 'failed — see server log');
  } else if (act === 'comment_issue') {
    const text = prompt(`comment on issue #${b.dataset.issue}:`);
    if (!text) return;
    const r = await fetch('/api/comment_issue', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue, body: text }) });
    alert((await r.json()).ok ? 'commented' : 'failed — see server log');
  } else if (act === 'close_issue') {
    if (!confirm(`close issue #${b.dataset.issue}?`)) return;
    const input = prompt('reason for closing — type "completed" or "not planned":', 'completed');
    if (input === null) return;
    const reason = input.trim().toLowerCase();
    if (reason !== 'completed' && reason !== 'not planned') {
      alert('reason must be exactly "completed" or "not planned" — aborted, nothing closed');
      return;
    }
    const r = await fetch('/api/close_issue', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue, reason }) });
    alert((await r.json()).ok ? 'closed' : 'failed — see server log');
  }
});

// ---------------------------------------------------------------------------------------------
// gh#262 -- boot()'s and loadMembers()'s Promise.all chains used to let any single failed fetch
// (server restart mid-deploy, a GH API rate-limit, a DB lock) reject silently: .json() throws on
// a non-JSON error body, the outer Promise.all rejects, boot() aborts, and the page is left
// blank -- pixel-identical to a genuinely idle fleet. fetchJSON() labels the failure with the
// endpoint that caused it so the banner below can name it.
// ---------------------------------------------------------------------------------------------
function fetchJSON(url) {
  return fetch(url).then(r => {
    if (!r.ok) throw new Error(`${url} returned ${r.status}`);
    return r.json();
  });
}

const bootErrorEl = document.getElementById('bootError');
const bootErrorMsgEl = document.getElementById('bootErrorMsg');
function showBootError(detail) {
  bootErrorMsgEl.textContent = `dashboard failed to load — ${detail}`;
  bootErrorEl.style.display = '';
}
function clearBootError() { bootErrorEl.style.display = 'none'; }
document.getElementById('bootErrorRetry').onclick = () => boot();
document.getElementById('bootErrorDismiss').onclick = clearBootError;

// ---------------------------------------------------------------------------------------------
// gh#399: /api/alerts is the one place the fleet's own severity feed (alert_store.py, PR#397)
// gets a human-visible consumer. Reuses the boot-error-banner DOM/CSS pattern rather than a
// dismiss-able toast: a resolved alert must clear itself on the next poll (AC5), never require
// a click, so unlike bootError there is no dismiss button here at all.
// ---------------------------------------------------------------------------------------------
const alertBannerEl = document.getElementById('alertBanner');
const alertBannerMsgEl = document.getElementById('alertBannerMsg');
const budgetUnsafeEl = document.getElementById('budgetUnsafe');

function renderAlertsUI(data) {
  const worst = data.worst || 'unknown';
  budgetUnsafeEl.style.display = data.budget_safe === false ? '' : 'none';
  if (worst === 'ok') {
    alertBannerEl.style.display = 'none';
    return;
  }
  const counts = data.counts || {};
  const headParts = [];
  if (counts.critical) headParts.push(`${counts.critical} critical`);
  if (counts.degraded) headParts.push(`${counts.degraded} degraded`);
  // transient is deliberately NOT urgent -- alert_store.py's own severity doc: "NOT evidence
  // the watched thing is broken; it is evidence we are blind. NEVER pages on its own." Naming
  // it separately (and never in the red/amber classes below) keeps a container mid-restart
  // from reading as a real fault, which is the exact noise this whole feed exists to end.
  if (counts.transient) headParts.push(`${counts.transient} transient (unconfirmed)`);
  if (!headParts.length) headParts.push(worst === 'unknown' ? 'alerts feed unreachable' : worst);
  const detail = (data.open || []).map(a => {
    const who = (a.handles && a.handles.length) ? ` (${a.handles.join(',')})` : '';
    return `${a.check}: ${a.problem}${who}`;
  }).join('; ');
  alertBannerMsgEl.textContent = `${headParts.join(', ')} alert(s) open` + (detail ? ` — ${detail}` : '');
  alertBannerEl.classList.toggle('degraded', worst === 'degraded');
  alertBannerEl.classList.toggle('transient', worst === 'transient');
  alertBannerEl.style.display = '';
}

async function renderAlerts() {
  try {
    let data;
    try {
      // Not fetchJSON(): /api/alerts fails open with a 503 body ({budget_safe:false,
      // worst:"unknown"}) on its own internal error (see alert_store snapshot()'s docstring) --
      // fetchJSON() would throw on that non-2xx and discard exactly the "do not trust me"
      // signal the endpoint went out of its way to hand back. Parse the body regardless of
      // status.
      const r = await fetch('/api/alerts');
      data = await r.json();
    } catch (err) {
      // Couldn't even reach it -- never render that as healthy.
      data = { worst: 'unknown', budget_safe: false, open: [], counts: {} };
    }
    renderAlertsUI(data);
  } catch (err) {
    // A malformed-but-successfully-fetched body must not take the whole boot() sequence down
    // with it -- renderAlerts() is awaited inside boot()'s own Promise.all, and an uncaught
    // throw here would surface as a full-page "dashboard failed to load" for what is really
    // just this one tile misbehaving.
    console.error('renderAlerts() failed:', err);
  }
}

// ---------------------------------------------------------------------------------------------
// gh#513: "the number" -- the same three readings (number, guardrail, channel) run_member.sh
// puts above every member's charter, mirrored here so a human watching the dashboard sees the
// business move or not move too. Hidden entirely when this instance has no FLEET_NUMBER_URL
// configured (number_read.py's own law: no URL means no header, not a placeholder) -- never
// rendered as zero.
// ---------------------------------------------------------------------------------------------
function numFmt(v) {
  if (v === null || v === undefined) return 'unmeasured';
  return typeof v === 'number' ? v.toLocaleString(undefined, { maximumFractionDigits: 2 }) : String(v);
}
function numDelta(v) {
  if (v === null || v === undefined) return '';
  const sign = v >= 0 ? '+' : '';
  return ` (${sign}${numFmt(v)}/7d)`;
}
function renderTheNumber(data) {
  const grp = document.getElementById('theNumber');
  if (!data || !data.configured) { grp.style.display = 'none'; return; }
  grp.style.display = '';
  const stale = !!data.stale;
  const cells = [
    ['numNumber', 'Number', data.payload && data.payload.number],
    ['numGuardrail', 'Guardrail', data.payload && data.payload.guardrail],
    ['numChannel', 'Channel', data.payload && data.payload.channel],
  ];
  for (const [id, label, block] of cells) {
    const el = document.getElementById(id);
    el.classList.toggle('bad', stale);
    if (!data.present || !block) {
      el.innerHTML = `<b>${esc(label)}</b> ${data.present ? 'unmeasured' : 'not yet read'}`;
      continue;
    }
    el.innerHTML = `<b>${esc(block.name || label)}</b> ${esc(numFmt(block.value))} ${esc(block.unit || '')}${esc(numDelta(block.delta_7d))}`;
    el.title = stale ? `STALE -- as of ${data.payload.as_of || '?'}` : `as of ${data.payload.as_of || '?'}`;
  }
}
async function renderTheNumberTile() {
  try {
    const data = await fetchJSON('/api/number');
    NUMBER_DATA = data;
    renderTheNumber(data);
    renderHomePage();
  } catch (err) {
    console.error('renderTheNumberTile() failed:', err);
  }
}

// ---------------------------------------------------------------------------------------------
// Fleet state (master toggle) + members (spec/effective/overrides/spend) + queue (next fires)
// ---------------------------------------------------------------------------------------------
async function renderFleetState() {
  const state = await fetchJSON('/api/fleet_state');
  FLEET_STATE = state;
  REPO_URL = state.REPO_URL || '';
  document.getElementById('repo').textContent = REPO_URL ? REPO_URL.replace(/^https?:\/\//, '') : '';
  renderSiblingSwitch(state.SIBLINGS || []);
}

// Sibling-instance dropdown in the topbar -- only when FLEET_SIBLINGS is configured (see
// fleet_view_server.py's _resolve_siblings). A plain link-out, same "no new authority" spirit
// as every other control here: picking one just navigates the browser, no cross-instance API
// call, no shared state. Rebuilt on every fleet_state poll -- the list is tiny and static, not
// worth diffing against the DOM.
function renderSiblingSwitch(siblings) {
  const el = document.getElementById('siblingSwitch');
  if (!siblings.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = `<option value="">switch instance&hellip;</option>` +
    siblings.map(s => `<option value="${esc(s.url)}">${esc(s.name)}</option>`).join('');
  el.onchange = () => { if (el.value) location.href = el.value; };
}

async function loadMembers() {
  const [{ members }, { spend }, { kpi }] = await Promise.all([
    fetchJSON('/api/members'),
    fetchJSON('/api/spend?hours=24'),
    fetchJSON('/api/kpi?hours=24'),
  ]);
  const spendByMember = Object.fromEntries((spend || []).map(s => [s.member, s]));
  members.forEach(m => { m._spend = spendByMember[m.spec.name]; });
  SPECS = members;
  KPI_BY_MEMBER = Object.fromEntries((kpi || []).map(k => [k.member, k]));
  if (!SELECTED && SPECS.length) SELECTED = SPECS[0].spec.name;
}

// The topbar's always-visible figure -- percent-of-week headroom (maxx_reader's
// week_bank_pct, the same unit gru packs against per fanout.py:11), not raw dollars.
// A dollar total has no ceiling to be a fraction of, so a real zero-headroom stall
// (gh#578, FLEET_SHARE_CEILING_PCT=0.0000) looked identical to a quiet day on the old
// "$4.12 today" topbar -- gh#561. null (meter unreadable/not configured) must render as
// its own visible state, never as "0% of week" -- an unreadable meter is not the same
// fact as a real, honest zero (maxx_reader.py's own over-vs-unreadable distinction).
// The dollar figure is not removed -- it still shows on each member's detail view,
// via renderDetailHead()'s spendLine.
//
// Deliberately NOT folded into loadMembers()'s Promise.all -- /api/budget_preview shells
// out through maxx_reader.py to a real remote meter and can legitimately take seconds, and
// a slow or failing read here has nothing to do with whether the member/spend/KPI tiles
// loaded. Same reasoning renderAlerts() documents at its own try/catch: awaited inside
// boot()'s Promise.all, an uncaught throw here would surface as a full-page "dashboard
// failed to load" for what is really just this one tile misbehaving.
async function refreshGlobalSpend() {
  try {
    renderGlobalSpend(await fetchJSON('/api/budget_preview'));
  } catch (err) {
    console.error('refreshGlobalSpend() failed:', err);
    renderGlobalSpend(null);
  }
}
function renderGlobalSpend(preview) {
  const el = document.getElementById('globalSpend');
  const pct = preview && preview.week_bank_pct;
  if (pct === null || pct === undefined) {
    el.innerHTML = `<span title="maxx meter unreadable or not configured for this instance">headroom unavailable</span>`;
    return;
  }
  el.innerHTML = `${Number(pct).toFixed(1)}% <b>of week</b>`;
}

async function renderQueue() {
  const { next_fires } = await fetchJSON('/api/next_fires');
  NEXT_FIRES = next_fires || [];
  // Bug (Reif, 2026-08-25 screenshot): this 15s-interval call rendered the agent detail head
  // over whatever page the user had actually navigated to (Self-Evolution's PR rows showing
  // under the last-selected agent's name/header) -- renderDetailHead() unconditionally
  // overwrites detailHeadEl with agent info regardless of PAGE. Guard it the same way
  // renderQueuePage/renderEvolutionPage/renderSettingsPage already guard themselves.
  if (PAGE === 'agent') renderDetailHead();
}

// ---------------------------------------------------------------------------------------------
// Live stream: new runs append to ALL_RUNS; re-render sidebar always (status dots), re-render
// run list + detail head only if the event is for the currently selected agent.
// ---------------------------------------------------------------------------------------------
function onRunEvent(rec) {
  ALL_RUNS.push(rec);
  if (ALL_RUNS.length > 2000) ALL_RUNS.shift();
  renderSidebar();
  if (PAGE === 'agent' && rec.member === SELECTED) { renderRunList(); renderDetailHead(); }
  if (PAGE === 'home') renderHomePage(); // a new run can move the "alive" tile's age
}

function appendLiveLine(rec) {
  if (rec.member !== SELECTED) return;
  const row = runListEl.querySelector('.run-row.open');
  const box = row && row.querySelector('.transcript.open');
  if (!box) return;
  box.insertAdjacentHTML('beforeend', renderTline(rec.line, 'live'));
}

// Re-entrancy guard: the retry button calls boot() directly, and a double-click (or any
// duplicate click event) while an earlier call is still in flight would otherwise let two
// successful boots both reach the tail below and register duplicate setIntervals + a
// duplicate EventSource/listener set.
let BOOTING = false;

async function boot() {
  if (BOOTING) return;
  BOOTING = true;
  try {
    let snap;
    try {
      // renderQueue() is folded into this same try -- it's still part of boot()'s own
      // startup sequence (populates NEXT_FIRES before selectAgent() runs), so a failure here
      // must abort the same way the outer Promise.all's failures do, not silently skip
      // straight past selectAgent()/setInterval()/EventSource without ever showing a banner.
      [snap] = await Promise.all([
        fetchJSON('/api/snapshot'),
        renderFleetState(),
        loadMembers(),
        renderAlerts(),
        renderTheNumberTile(),
        refreshGlobalSpend(),
      ]);
      ALL_RUNS = snap.runs || [];
      GH = snap.gh || { prs: [], issues: [], merged: [], self_evolution: [] };
      resortSidebar();
      renderSidebar();
      await renderQueue();
    } catch (err) {
      showBootError(err.message || String(err));
      return;
    }
    clearBootError();
    // gh#228: boot() used to call selectAgent(SELECTED) unconditionally here, which forces
    // PAGE = 'agent' regardless of the fire-first default set above -- respect PAGE instead,
    // so a fresh load actually lands on 'home' (gh#560) rather than being immediately overridden
    // back to whichever agent loadMembers() picked first.
    if (PAGE === 'agent') selectAgent(SELECTED);
    else selectPage(PAGE);
    // Same PAGE guard as renderQueue() above -- loadMembers() itself is page-agnostic (spend/KPI
    // data every page's sidebar KPI line needs), but renderDetailHead() is agent-page-only. A
    // failure here (gh#262) is a background poll, not the initial boot -- the page already has
    // data on screen, so just log it rather than interrupting with the boot banner.
    setInterval(async () => {
      try { await loadMembers(); renderSidebar(); if (PAGE === 'agent') renderDetailHead(); }
      catch (err) { console.error('periodic loadMembers() failed:', err); }
      // gh#399 AC1: /api/alerts rides this same 30s "other live tiles" interval rather than
      // a new setInterval of its own. gh#513's number tile does the same -- it changes at
      // most once a night (number_read.py's cron), so there is no case for its own timer.
      renderAlerts();
      renderTheNumberTile();
      refreshGlobalSpend();
    }, 30000);
    setInterval(renderQueue, 15000);

    const es = new EventSource('/api/stream');
    es.onopen = () => dot.classList.add('live');
    es.onerror = () => dot.classList.remove('live');
    es.addEventListener('run', e => { onRunEvent(JSON.parse(e.data)); renderQueue(); });
    es.addEventListener('gh', e => { GH = JSON.parse(e.data); renderSidebar(); renderQueuePage(); renderMergedPage(); renderEvolutionPage(); renderHomePage(); });
    es.addEventListener('logline', e => appendLiveLine(JSON.parse(e.data)));
  } finally {
    BOOTING = false;
  }
}
boot();
</script>
</body>
</html>
