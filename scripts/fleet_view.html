<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fleet-kit console</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f3; --border: #d8dce2;
    --text: #1c1e21; --dim: #6b6f76; --dimmer: #9a9ea6;
    --ok: #1f8b4c; --warn: #a6720f; --bad: #c13a2e; --accent: #2166c4;
    --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 var(--mono); overflow: hidden; }
  button { font-family: inherit; font-size: 12px; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }

  /* ---------- shell: topbar + sidebar + detail, all fixed-height regions, only the
     scrollable inner lists scroll -- no page-level scroll, ever. ---------- */
  .shell { display: grid; grid-template-rows: 40px 1fr; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 0 14px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .topbar .brand { font-weight: 600; letter-spacing: .02em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dimmer); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
  .topbar .spacer { flex: 1; }
  .topbar .stat { color: var(--dim); font-size: 11.5px; }
  .topbar .stat b { color: var(--text); }
  .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; }
  .btn:hover { border-color: var(--accent); }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.go { border-color: var(--ok); color: var(--ok); }
  .btn.small { padding: 2px 7px; font-size: 11px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }

  .body { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }

  /* ---------- sidebar: the agent roster, always visible, one click to switch ---------- */
  .sidebar { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
  .side-head { padding: 10px 12px 6px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--dimmer); }
  .agent-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px;
    cursor: pointer; border-left: 2px solid transparent; }
  .agent-item:hover { background: var(--panel-2); }
  .agent-item.active { background: var(--panel-2); border-left-color: var(--accent); }
  .agent-item .astatus { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 5px; }
  .astatus.ok { background: var(--ok); }
  .astatus.bad { background: var(--bad); }
  .astatus.warn { background: var(--warn); }
  .astatus.off { background: var(--dimmer); }
  .agent-item .atext { flex: 1; min-width: 0; }
  .agent-item .aname { overflow-wrap: break-word; }
  .agent-item.disabled-agent .aname { color: var(--dimmer); text-decoration: line-through; }
  .agent-item .aago { color: var(--dimmer); font-size: 10.5px; margin-top: 1px; }
  .agent-item .akpi { color: var(--dim); font-size: 10.5px; margin-top: 1px; font-weight: 600; }

  /* ---------- center: selected agent's detail -- header/actions fixed, run list scrolls ---------- */
  .detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .detail-head { padding: 12px 16px; background: var(--panel-2); border-bottom: 2px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.05); flex: none; }
  .detail-head .title-row { display: flex; align-items: center; gap: 10px; }
  .detail-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .detail-head .lane { color: var(--dim); font-size: 11.5px; }
  .detail-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .dial-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .dial { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 8px; font-size: 11px; color: var(--dim); cursor: pointer; }
  .dial:hover { border-color: var(--accent); color: var(--text); }
  .override-note { color: var(--warn); font-size: 11px; margin-top: 6px; }
  .spend-line { color: var(--dim); font-size: 11.5px; margin-top: 6px; }

  .hist-toggle { display: flex; gap: 4px; margin-top: 10px; }
  .hist-toggle button { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 10px; font-size: 11.5px; color: var(--dim); cursor: pointer; }
  .hist-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .run-list { flex: 1; overflow-y: auto; min-height: 0; }
  .run-empty { padding: 30px; color: var(--dimmer); text-align: center; }
  .upcoming-card { margin: 16px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; }
  .upcoming-card .u-in { font-size: 20px; font-weight: 700; }
  .upcoming-card .rmeta { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
  .run-row { padding: 9px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .run-row:hover { background: var(--panel); }
  .run-row.open { background: var(--panel); }
  .run-row .rline1 { display: flex; align-items: baseline; gap: 8px; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 6px;
    border-radius: 3px; flex: none; }
  .badge.ok { background: rgba(76,175,111,.16); color: var(--ok); }
  .badge.quiet { background: rgba(217,164,65,.16); color: var(--warn); }
  .badge.reported_nothing, .badge.no_vision_link, .badge.fail { background: rgba(224,100,90,.16); color: var(--bad); }
  .badge.pending, .badge.upcoming { background: rgba(122,125,134,.16); color: var(--dim); }
  .run-row .rtime { color: var(--dimmer); font-size: 11px; margin-left: auto; flex: none; }
  .run-row .rmeta { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .run-row .routcome { margin-top: 5px; }
  .run-row .o-tldr { font-size: 13px; font-weight: 600; line-height: 1.4; }
  .run-row .o-detail { margin-top: 4px; color: var(--dim); font-size: 11.5px; line-height: 1.6; }
  .run-row .routcome code, .run-row .rmeta code { font-family: var(--mono); background: var(--panel-2);
    padding: 0 3px; border-radius: 3px; font-size: 11px; word-break: break-all; }
  .run-row .rid { color: var(--dimmer); font-size: 10.5px; margin-top: 2px; cursor: copy; }
  .run-row .rid:hover { color: var(--accent); }
  .dedup-badge { color: var(--accent); font-size: 10.5px; margin-left: 6px; }

  .transcript { display: none; margin-top: 7px; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; max-height: 320px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all; font-size: 11px; color: var(--dim); }
  .transcript.open { display: block; }
  .tcopy-row { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .transcript .tline { padding: 2px 0; border-left: 2px solid transparent; padding-left: 6px; }
  .transcript .tline.live { color: var(--accent); }
  .transcript .tts { color: var(--dimmer); margin-right: 6px; font-size: 10px; }
  .transcript .ttext { white-space: pre-wrap; }
  /* thinking: italic + dim -- the model's own reasoning, lowest visual weight */
  .transcript .tk-thinking .ttext { font-style: italic; color: var(--dimmer); }
  /* tool call: accent-colored, bold-ish -- what the agent DID */
  .transcript .tk-call { border-left-color: var(--accent); }
  .transcript .tk-call .ttext { color: var(--text); }
  /* tool result ok: quiet dim green -- succeeded, not worth dwelling on */
  .transcript .tk-result-ok { border-left-color: var(--ok); }
  .transcript .tk-result-ok .ttext { color: var(--dim); }
  /* tool result ERROR: stays loud -- exactly what a human scans a transcript for, never muted */
  .transcript .tk-result-err { border-left-color: var(--bad); background: rgba(224,100,90,.08); }
  .transcript .tk-result-err .ttext { color: var(--bad); }
  /* pass start/end/result markers: a subtle divider, not a normal content row */
  .transcript .tk-marker { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 5px; }
  .transcript .tk-marker .ttext { color: var(--dimmer); font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  /* long tool result: short/full text coexist in the DOM, CSS swaps which shows */
  .transcript .tfull { display: none; }
  .transcript .tline-expanded .tshort { display: none; }
  .transcript .tline-expanded .tfull { display: inline; }
  .transcript .tmore { display: block; color: var(--accent); cursor: pointer; font-size: 10.5px; margin-top: 2px; }
  .transcript .tline-expanded .tmore { display: none; }
  .row.upcoming, .run-row.upcoming { opacity: .5; cursor: default; }

  /* ---------- pages: PRs+backlog and settings, now sidebar-selected views inside .detail ---------- */
  .rail-section { border-bottom: 1px solid var(--border); }
  .rail-head { padding: 9px 16px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dimmer); display: flex; align-items: center; gap: 6px; position: sticky; top: 0;
    background: var(--panel); }
  .count-badge { background: var(--panel-2); border-radius: 8px; padding: 0 6px; font-size: 10px; color: var(--dim); }
  .rail-row { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .rail-row .rmeta { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .rail-row .actions { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .checks-green { color: var(--ok); } .checks-pending { color: var(--warn); } .checks-failing { color: var(--bad); }

  /* ---------- sidebar nav items: PRs/Backlog + Settings, same list as agents, separated ---------- */
  .side-nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
    border-left: 2px solid transparent; color: var(--text); }
  .side-nav-item:hover { background: var(--panel-2); }
  .side-nav-item.active { background: var(--panel-2); border-left-color: var(--accent); }
  .side-nav-item .count-badge { margin-left: auto; }
  .side-sep { border-top: 1px solid var(--border); margin: 6px 0; }

  .settings-block { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .settings-block h3 { margin: 0 0 8px; font-size: 12.5px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--dim); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 5px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: var(--dimmer); }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="brand">fleet-kit</span>
    <span class="stat" id="repo"></span>
    <span class="spacer"></span>
    <span class="stat" id="globalSpend"></span>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="side-head">Agents</div>
      <div id="agentList"></div>
      <div class="side-sep"></div>
      <div class="side-nav-item" data-page="queue">
        PRs &amp; Backlog <span class="count-badge" id="navQueueCount">0</span>
      </div>
      <div class="side-nav-item" data-page="merged">
        Recently Merged <span class="count-badge" id="navMergedCount">0</span>
      </div>
      <div class="side-nav-item" data-page="evolution">
        Self-Evolution <span class="count-badge" id="navEvolutionCount">0</span>
      </div>
      <div class="side-nav-item" data-page="settings">Settings</div>
    </div>
    <div class="detail" id="detailPane">
      <div class="detail-head" id="detailHead"></div>
      <div class="run-list" id="runList"><div class="run-empty">select an agent</div></div>
    </div>
  </div>
</div>
<script>
// ---------------------------------------------------------------------------------------------
// State: one flat run list (all agents, as they stream in) + a per-agent index into it, so
// switching the sidebar selection never refetches -- it just re-filters what's already in memory.
// ---------------------------------------------------------------------------------------------
let REPO_URL = '';
let SPECS = [];          // from /api/members -- spec + effective + overrides, per agent
let ALL_RUNS = [];        // oldest-first, matches runs.jsonl append order
let SELECTED = null;      // currently open agent name, or null (only meaningful when PAGE==='agent')
let PAGE = 'agent';       // 'agent' | 'queue' | 'settings' -- which sidebar item is active
let GH = { prs: [], issues: [], merged: [], self_evolution: [] };
let FLEET_STATE = {};
let NEXT_FIRES = [];
let KPI_BY_MEMBER = {}; // member name -> /api/kpi row ({total, unit, runs_with_kpi, runs_total})
const dot = document.getElementById('dot');
const agentListEl = document.getElementById('agentList');
const detailHeadEl = document.getElementById('detailHead');
const runListEl = document.getElementById('runList'); // reused as the generic page-body region

function esc(s) { return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(iso_or_epoch) {
  if (!iso_or_epoch) return '';
  const t = typeof iso_or_epoch === 'number' ? iso_or_epoch * 1000 : Date.parse(iso_or_epoch);
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}
function clockTime(epoch) {
  if (!epoch) return '';
  return new Date(epoch * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function fmtIn(s) {
  if (s === null || s === undefined) return '—';
  if (s <= 0) return 'due now';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  return (s / 3600).toFixed(1) + 'h';
}
function copyText(text, el) {
  navigator.clipboard?.writeText(text).then(() => {
    const prev = el.textContent;
    el.textContent = 'copied ✓';
    setTimeout(() => { el.textContent = prev; }, 900);
  });
}

// ---------------------------------------------------------------------------------------------
// Sidebar: one row per agent from /api/members (real spec discovery, not a hand list -- the
// old dashboard already learned that lesson the hard way once). Status dot reflects the most
// recent run's status for that agent, not just "enabled/disabled".
// ---------------------------------------------------------------------------------------------
function lastRunFor(name) {
  for (let i = ALL_RUNS.length - 1; i >= 0; i--) {
    if (ALL_RUNS[i].member === name) return ALL_RUNS[i];
  }
  return null;
}
function statusClass(status) {
  if (status === 'ok') return 'ok';
  if (status === 'quiet') return 'warn';
  if (!status) return 'off';
  return 'bad'; // reported_nothing, no_vision_link, fail, etc.
}

let SIDEBAR_ORDER = null; // cached agent-name order -- computed once per resort, not per render

function resortSidebar() {
  // Most-recently-run agent first -- a console should surface what just happened, not an
  // arbitrary spec-discovery order. Agents with no runs yet sort to the bottom.
  SIDEBAR_ORDER = SPECS.slice().sort((a, b) => {
    const la = lastRunFor(a.spec.name)?.ts ?? -1;
    const lb = lastRunFor(b.spec.name)?.ts ?? -1;
    return lb - la;
  }).map(m => m.spec.name);
}

function renderSidebar() {
  // Re-render must NOT re-sort: a live tick reordering rows while the user is mid-click moves
  // the row out from under the cursor (confirmed live -- a click on "marie" landed on
  // "Settings" because the list resorted between mousedown and click). Order only changes on
  // an explicit resortSidebar() call (boot, or a new agent appearing).
  if (!SIDEBAR_ORDER) resortSidebar();
  const byName = Object.fromEntries(SPECS.map(m => [m.spec.name, m]));
  const ranked = SIDEBAR_ORDER.map(n => byName[n]).filter(Boolean);
  // an agent /api/members returned that isn't in the cached order yet (newly added) -- append it
  SPECS.forEach(m => { if (!SIDEBAR_ORDER.includes(m.spec.name)) ranked.push(m); });
  agentListEl.innerHTML = ranked.map(m => {
    const name = m.spec.name;
    const enabled = !!m.effective.enabled;
    const last = lastRunFor(name);
    const cls = !enabled ? 'off' : statusClass(last?.status);
    const active = PAGE === 'agent' && name === SELECTED;
    const k = KPI_BY_MEMBER[name];
    const kpiLine = (k && k.total !== null && k.total !== undefined && k.unit)
      ? `<div class="akpi">${k.total} ${esc(k.unit)}</div>` : '';
    return `<div class="agent-item ${active ? 'active' : ''} ${!enabled ? 'disabled-agent' : ''}"
        data-agent="${esc(name)}">
      <span class="astatus ${cls}"></span>
      <div class="atext">
        <div class="aname">${esc(name)}</div>
        <div class="aago">${last ? ago(last.ts) : 'never run'}</div>
        ${kpiLine}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.side-nav-item').forEach(el => {
    el.classList.toggle('active', PAGE === el.dataset.page);
  });
  document.getElementById('navQueueCount').textContent = (GH.prs?.length || 0) + (GH.issues?.length || 0);
  document.getElementById('navMergedCount').textContent = GH.merged?.length || 0;
  document.getElementById('navEvolutionCount').textContent = GH.self_evolution?.length || 0;
}

agentListEl.addEventListener('click', e => {
  const row = e.target.closest('.agent-item');
  if (!row) return;
  selectAgent(row.dataset.agent);
});

document.querySelectorAll('.side-nav-item').forEach(el => {
  el.addEventListener('click', () => selectPage(el.dataset.page));
});

// ---------------------------------------------------------------------------------------------
// Detail head: name, lane/kind, spend, live dials, and the action bar -- rerun/enable/disable
// all live right here, next to the agent you're looking at, not buried in a separate rail.
// ---------------------------------------------------------------------------------------------
const DIAL_KEYS = ['max_turns', 'model', 'enabled', 'schedule'];
function dialValue(eff, key) {
  if (key === 'enabled') return eff.enabled;
  if (key === 'schedule') return JSON.stringify(eff.schedule);
  return (eff.llm || {})[key];
}

// KPI-in-title text: "roomba · 47 worktrees evaluated today" when this member has a defined
// KPI shape and at least one counted run in the window; falls back to nothing (just the plain
// name) for a member with no KPI shape (fleet_kpi.py returns total:null for those) or zero
// counted runs yet -- never show a fabricated "0 <unit>" for a member that has no unit to begin
// with.
function kpiTitleSuffix(name) {
  const k = KPI_BY_MEMBER[name];
  if (!k || k.total === null || k.total === undefined || !k.unit) return '';
  return ` · ${k.total} ${k.unit} today`;
}

function renderDetailHead() {
  const m = SPECS.find(s => s.spec.name === SELECTED);
  if (!m) { detailHeadEl.innerHTML = ''; return; }
  const name = m.spec.name;
  const enabled = !!m.effective.enabled;
  const spendEl = m._spend;
  const spendLine = spendEl
    ? `$${(spendEl.total_cost || 0).toFixed(2)} · ${spendEl.runs} runs · ${spendEl.total_turns || 0} turns (24h)`
    : 'no runs in 24h';
  const overrideNote = m.overrides.length
    ? `<div class="override-note">live overrides: ${m.overrides.map(o => `${esc(o.key)}=${esc(JSON.stringify(o.value))} (${esc(o.why)})`).join(', ')}</div>`
    : '';
  const dials = DIAL_KEYS.map(key => {
    const v = dialValue(m.effective, key);
    return `<button class="dial" data-act="edit-dial" data-member="${esc(name)}" data-key="${key}">${key}=${esc(JSON.stringify(v))}</button>`;
  }).join('');
  const next = NEXT_FIRES.find(f => f.member === name);
  const nextLine = next && next.enabled ? `next run in ${fmtIn(next.in_s)}` : (enabled ? '' : 'disabled — not scheduled');

  detailHeadEl.innerHTML = `
    <div class="title-row">
      <h2>${esc(name)}${esc(kpiTitleSuffix(name))}</h2>
      <span class="lane">${esc(m.spec.kind)}${m.spec.lane ? ' · ' + esc(m.spec.lane) : ''}</span>
    </div>
    <div class="spend-line">${esc(spendLine)}${nextLine ? ' · ' + esc(nextLine) : ''}</div>
    ${overrideNote}
    <div class="detail-actions">
      <button class="btn primary" data-act="run-now" data-member="${esc(name)}">▶ rerun now</button>
      <button class="btn ${enabled ? 'danger' : 'go'}" data-act="toggle-member" data-member="${esc(name)}" data-on="${enabled}">
        ${enabled ? '■ disable' : '● enable'}
      </button>
    </div>
    <div class="dial-row">${dials}</div>
    <div class="hist-toggle">
      <button data-view="history" class="${RUN_VIEW === 'history' ? 'active' : ''}">history</button>
      <button data-view="upcoming" class="${RUN_VIEW === 'upcoming' ? 'active' : ''}">upcoming</button>
    </div>`;
}

// ---------------------------------------------------------------------------------------------
// Run list: filtered to the selected agent, newest at top (a console reads status top-down,
// unlike the old feed's chat-style bottom-anchor) -- own scroll region, page never scrolls.
// ---------------------------------------------------------------------------------------------
const memberRunTotal = {}; // per-member count for pass_log's seqFromEnd, same convention as before

function reindexSeq(name) {
  const runs = ALL_RUNS.filter(r => r.member === name);
  runs.forEach((r, i) => { r._seqFromEnd = runs.length - 1 - i; });
}

let OPEN_TRANSCRIPT_RUN_ID = null; // survives renderRunList() rebuilds -- see restoreOpenTranscript()
let RUN_VIEW = 'history'; // 'history' (past runs) | 'upcoming' (this member's single next scheduled fire)

// ---------------------------------------------------------------------------------------------
// Transcript line rendering: run_member.sh's stream_log.py writes every log line with a fixed
// prefix shape ("[ts] pass start ...", "[ts] thinking: ...", "[ts] tool call: X -- args",
// "[ts] tool result (ok|ERROR): ..."). Parse that prefix once per line so thinking/tool-call/
// tool-result/error render as visually distinct rows instead of one flat grey dump (Reif,
// 2026-08-25: "more readable transcript"). No backend change needed -- read_pass_block already
// returns these exact lines, this is purely a frontend render.
// ---------------------------------------------------------------------------------------------
const TLINE_RE = /^\[([^\]]+)\]\s(.*)$/s;
function classifyTline(raw) {
  const m = TLINE_RE.exec(raw);
  const ts = m ? m[1] : '';
  const rest = m ? m[2] : raw;
  let kind = 'plain';
  if (/^(pass start|pass end|pass result|session init)\b/.test(rest)) kind = 'marker';
  else if (rest.startsWith('thinking:')) kind = 'thinking';
  else if (rest.startsWith('tool call:')) kind = 'call';
  else if (rest.startsWith('tool result (ok')) kind = 'result-ok';
  else if (rest.startsWith('tool result (ERROR')) kind = 'result-err';
  return { ts, rest, kind };
}
function renderTline(raw, extraClass) {
  const { ts, rest, kind } = classifyTline(raw);
  // A long tool result (several samples run multi-KB) pushes everything else out of the
  // 320px-tall scrollable box -- collapse anything past 4 lines behind a toggle, always shown
  // in full for an ERROR (errors are exactly what a human scans for, never collapse those).
  // Full text is always in the DOM (never re-fetched on expand); CSS just switches which of
  // .tshort/.tfull is visible once '.tline-expanded' is added by the click handler.
  const lines = rest.split('\n');
  const long = kind !== 'result-err' && lines.length > 4;
  if (!long) {
    return `<div class="tline tk-${kind} ${extraClass || ''}">
      ${ts ? `<span class="tts">${esc(ts)}</span>` : ''}<span class="ttext">${esc(rest)}</span>
    </div>`;
  }
  const shortText = lines.slice(0, 4).join('\n');
  return `<div class="tline tk-${kind} ${extraClass || ''}">
    ${ts ? `<span class="tts">${esc(ts)}</span>` : ''}<span class="ttext tshort">${esc(shortText)}</span><span class="ttext tfull">${esc(rest)}</span>
    <span class="tmore" data-act="expand-tline">… ${lines.length - 4} more lines</span>
  </div>`;
}

async function loadTranscriptInto(box, rec) {
  box.dataset.loaded = '1';
  box.innerHTML = '<div class="tline">loading transcript…</div>';
  try {
    const r = await fetch(`/api/pass_log?member=${encodeURIComponent(rec.member)}&n=${rec._seqFromEnd}`);
    const { lines } = await r.json();
    // Raw lines kept on the box itself (not re-derived from rendered HTML, which has been
    // reformatted/collapsed) so the copy button always copies the real, complete transcript.
    box.dataset.rawLines = JSON.stringify(lines || []);
    const header = '<div class="tcopy-row"><button class="btn small" data-act="copy-transcript">copy transcript</button></div>';
    box.innerHTML = (lines && lines.length)
      ? header + lines.map(l => renderTline(l)).join('')
      : '<div class="tline">no transcript recorded for this pass</div>';
  } catch {
    box.innerHTML = '<div class="tline">failed to load transcript</div>';
  }
}

async function toggleTranscript(rowEl, rec) {
  const box = rowEl.querySelector('.transcript');
  if (!box) return;
  const willOpen = !box.classList.contains('open');
  box.classList.toggle('open', willOpen);
  rowEl.classList.toggle('open', willOpen);
  OPEN_TRANSCRIPT_RUN_ID = willOpen ? rec.run_id : null;
  if (willOpen && !box.dataset.loaded) await loadTranscriptInto(box, rec);
}

// A live tick / new run event rebuilds the whole run list from scratch (renderRunList below) --
// that used to silently close whatever transcript the user had open (confirmed live: "it closes
// too quickly"). Re-open the same run's box, right after each rebuild, using the cached run_id.
function restoreOpenTranscript() {
  if (!OPEN_TRANSCRIPT_RUN_ID) return;
  const rowEl = runListEl.querySelector(`.run-row[data-run-id="${CSS.escape(OPEN_TRANSCRIPT_RUN_ID)}"]`);
  const box = rowEl?.querySelector('.transcript');
  if (!box) return; // that run scrolled out of the (collapsed) group -- nothing to restore onto
  box.classList.add('open');
  rowEl.classList.add('open');
  const rec = ALL_RUNS.find(r => r.run_id === OPEN_TRANSCRIPT_RUN_ID);
  if (rec) loadTranscriptInto(box, rec); // re-fetch -- cheap, and the old dataset.loaded is gone
}

function noOutcomeHint(rec) {
  return rec.exit_code && rec.exit_code !== 0
    ? `exit code ${esc(rec.exit_code)} — crashed, not "found nothing"`
    : esc(rec.self_critique || 'ran fine, reported no outcome');
}

// Outcome strings are one run-on sentence (semicolon-joined clauses, absolute paths inline) --
// unreadable as a single paragraph (Reif, 2026-08-23 screenshot: "I cant read this"). Split into
// a bold TLDR (first clause) + the rest as dimmed detail lines, monospacing path-like tokens.
function formatOutcome(raw) {
  if (!raw) return '';
  const parts = raw.split(/;\s+/).map(p => p.trim()).filter(Boolean);
  const mono = s => esc(s).replace(/(\/[\w.\-\/]+\.\w+(?::\d+)?|#\d{3,})/g, '<code>$1</code>');
  const [tldr, ...rest] = parts;
  let html = `<div class="o-tldr">${mono(tldr)}</div>`;
  if (rest.length) html += `<div class="o-detail">${rest.map(mono).join('<br>')}</div>`;
  return html;
}

function runRowHtml(rec, dupCount) {
  const status = rec.status || 'pending';
  const pr = rec.pr
    ? (REPO_URL ? `<a href="${REPO_URL}/pull/${esc(rec.pr)}" target="_blank" onclick="event.stopPropagation()">PR #${esc(rec.pr)}</a>`
                : `PR #${esc(rec.pr)}`)
    : '';
  const dup = dupCount > 1 ? `<span class="dedup-badge">×${dupCount}</span>` : '';
  return `
    <div class="rline1">
      <span class="badge ${esc(status)}">${esc(status)}</span>
      <span class="rmeta">${esc(rec.kind || '')} · item ${esc(rec.item_id || '—')}${pr ? ' · ' + pr : ''}</span>
      ${dup}
      <span class="rtime">${rec.ts ? clockTime(rec.ts) + ' · ' + ago(rec.ts) : ''}</span>
    </div>
    <div class="routcome">${rec.outcome ? formatOutcome(rec.outcome) : noOutcomeHint(rec)}</div>
    ${rec.evidence ? `<div class="rmeta">${formatOutcome(rec.evidence)}</div>` : ''}
    ${(() => {
      // Every run should show its cost, even a zero-spend one -- a run card with a status
      // badge and no token line reads as "we don't know what this cost," when the real
      // answer for a budget_declined/exhausted run is "nothing, it never got to spend."
      // (Reif, 2026-08-25: "every fleet session should show its token usage" -- the truthy
      // `rec.tokens.cost_usd` check below silently dropped the whole line for cost_usd=0 or
      // =null, which is exactly every account-pool-exhausted run.)
      const t = rec.tokens;
      if (t && typeof t.cost_usd === 'number') {
        return `<div class="rmeta">$${t.cost_usd.toFixed(3)} · ${esc(t.num_turns ?? 0)} turns</div>`;
      }
      if (rec.status === 'budget_declined') {
        return `<div class="rmeta">$0.000 · declined before spending</div>`;
      }
      return '';
    })()}
    ${rec.run_id ? `<div class="rid" title="click to copy run_id">${esc(rec.run_id)}</div>` : ''}
    <div class="transcript"></div>`;
}

function renderUpcomingCard() {
  const m = SPECS.find(s => s.spec.name === SELECTED);
  const next = NEXT_FIRES.find(f => f.member === SELECTED);
  if (!next || !next.enabled) {
    runListEl.innerHTML = `<div class="run-empty">${m && !m.effective.enabled ? 'disabled — not scheduled' : 'no upcoming run scheduled'}</div>`;
    return;
  }
  const sched = (m?.spec?.schedule && JSON.stringify(m.spec.schedule)) || '';
  runListEl.innerHTML = `
    <div class="upcoming-card">
      <div class="u-in">next run in ${esc(fmtIn(next.in_s))}</div>
      <div class="rmeta">${esc(m?.spec?.kind || '')}${m?.spec?.lane ? ' · ' + esc(m.spec.lane) : ''}</div>
      ${sched ? `<div class="rmeta">schedule: <code>${esc(sched)}</code></div>` : ''}
      <div class="rmeta">only the next fire is known -- schedule is interval-based, not a queue</div>
    </div>`;
}

function renderRunList() {
  if (!SELECTED) { runListEl.innerHTML = '<div class="run-empty">select an agent</div>'; return; }
  if (RUN_VIEW === 'upcoming') { renderUpcomingCard(); return; }
  reindexSeq(SELECTED);
  const runs = ALL_RUNS.filter(r => r.member === SELECTED).slice().reverse(); // newest first
  if (!runs.length) { runListEl.innerHTML = '<div class="run-empty">no runs recorded yet</div>'; return; }

  // Collapse consecutive identical (status, outcome) runs same as before -- a fanout finding
  // nothing 5x is one fact, not 5 rows.
  const groups = [];
  for (const r of runs) {
    const key = `${r.status || ''}|${r.outcome || ''}`;
    const last = groups[groups.length - 1];
    if (last && last.key === key) { last.count++; last.rec = r; /* keep newest of the group */ }
    else groups.push({ key, count: 1, rec: r });
  }
  runListEl.innerHTML = groups.map(g =>
    `<div class="run-row" data-run-id="${esc(g.rec.run_id || '')}">${runRowHtml(g.rec, g.count)}</div>`
  ).join('');
  restoreOpenTranscript();
}

runListEl.addEventListener('click', e => {
  const moreEl = e.target.closest('.tmore');
  if (moreEl) { moreEl.closest('.tline')?.classList.add('tline-expanded'); return; }
  const ridEl = e.target.closest('.rid');
  if (ridEl) { copyText(ridEl.textContent, ridEl); return; }
  const copyBtn = e.target.closest('[data-act="copy-transcript"]');
  if (copyBtn) {
    const box = copyBtn.closest('.transcript');
    const lines = JSON.parse(box?.dataset.rawLines || '[]');
    copyText(lines.join('\n'), copyBtn);
    return;
  }
  if (e.target.closest('a') || e.target.closest('button')) return;
  const row = e.target.closest('.run-row');
  if (!row) return;
  const rec = ALL_RUNS.slice().reverse().find(r => r.run_id === row.dataset.runId)
           || ALL_RUNS.filter(r => r.member === SELECTED).slice(-1)[0];
  toggleTranscript(row, rec);
});

function selectAgent(name) {
  if (name !== SELECTED) { OPEN_TRANSCRIPT_RUN_ID = null; RUN_VIEW = 'history'; } // switching agents, not just re-rendering
  PAGE = 'agent';
  SELECTED = name;
  renderSidebar();
  renderDetailHead();
  renderRunList();
}

detailHeadEl.addEventListener('click', e => {
  const btn = e.target.closest('.hist-toggle button');
  if (!btn) return;
  RUN_VIEW = btn.dataset.view;
  renderDetailHead();
  renderRunList();
});

function selectPage(page) {
  PAGE = page;
  renderSidebar();
  if (page === 'queue') renderQueuePage();
  else if (page === 'merged') renderMergedPage();
  else if (page === 'evolution') renderEvolutionPage();
  else if (page === 'settings') renderSettingsPage();
}

// ---------------------------------------------------------------------------------------------
// Recently Merged page: plain unfiltered merged-PR feed -- what actually shipped, any branch,
// any author. Own sidebar item (moved off the PRs & Backlog page, Reif 2026-08-25: buried at
// the bottom of a 68-item backlog, "where is that" -- needed a click of its own, not a scroll).
// ---------------------------------------------------------------------------------------------
function renderMergedPage() {
  if (PAGE !== 'merged') return;
  const merged = GH.merged || [];
  detailHeadEl.innerHTML = `<div class="title-row"><h2>Recently Merged</h2></div>`;
  const rowsHtml = merged.map(pr => `<div class="rail-row">
      <a href="${esc(pr.url)}" target="_blank">#${pr.number}</a>
      <div>${esc(pr.title)}</div>
      <div class="rmeta">${esc(pr.author?.login || '')} · merged ${ago(pr.mergedAt)} · ${(pr.files || []).length} file${(pr.files || []).length === 1 ? '' : 's'}</div>
    </div>`).join('') || '<div class="run-empty">nothing merged recently</div>';
  runListEl.innerHTML = `<div class="rail-section">${rowsHtml}</div>`;
}

// ---------------------------------------------------------------------------------------------
// Self-Evolution page: merged PRs SOURCED BY jefe or dumbledore -- the fleet's own two
// self-correcting personas deciding the fleet's rules should change, not any worker touching
// an agent-definition path as incidental work (see fleet_view_server.py's poll_gh_state for the
// branch-name filter and why PR author can't be used). Distinct from the plain Recently Merged
// page, which is unfiltered.
// ---------------------------------------------------------------------------------------------
function renderEvolutionPage() {
  if (PAGE !== 'evolution') return;
  const prs = GH.self_evolution || [];
  detailHeadEl.innerHTML = `<div class="title-row"><h2>Self-Evolution</h2></div>
    <div class="spend-line">merged PRs sourced by jefe or dumbledore -- the fleet deciding its own rules should change</div>`;
  const rowsHtml = prs.map(pr => {
    const fileList = (pr.files || []).map(f =>
      `<code>${esc(f.path)}</code> <span class="rmeta">+${f.additions}/-${f.deletions}</span>`
    ).join('<br>');
    return `<div class="rail-row">
      <a href="${esc(pr.url)}" target="_blank">#${pr.number}</a>
      <div>${esc(pr.title)}</div>
      <div class="rmeta">${esc(pr.headRefName || '')} · merged ${ago(pr.mergedAt)}</div>
      <div class="rmeta" style="margin-top:4px">${fileList}</div>
    </div>`;
  }).join('') || '<div class="run-empty">no jefe/dumbledore self-evolution PRs found yet</div>';
  runListEl.innerHTML = `<div class="rail-section">${rowsHtml}</div>`;
}

// ---------------------------------------------------------------------------------------------
// Queue page (sidebar item): PRs + backlog, now a full page instead of an always-visible rail --
// it's reference material you check, not something that should compete for space every screen.
// ---------------------------------------------------------------------------------------------
function renderQueuePage() {
  if (PAGE !== 'queue') return;
  const prs = GH.prs || [];
  const issues = GH.issues || [];
  detailHeadEl.innerHTML = `<div class="title-row"><h2>PRs &amp; Backlog</h2></div>`;

  const prsHtml = prs.map(pr => {
    const cls = pr._rollup === 'green' ? 'checks-green' : pr._rollup === 'failing' ? 'checks-failing' : 'checks-pending';
    return `<div class="rail-row">
      <a href="${esc(pr.url)}" target="_blank">#${pr.number}</a> ${pr.isDraft ? '<span class="rmeta">draft</span>' : ''}
      <div>${esc(pr.title)}</div>
      <div class="rmeta"><span class="${cls}">${esc(pr._rollup)}</span> · ${esc(pr.headRefName)} · ${ago(pr.updatedAt)}</div>
      <div class="actions"><button class="btn small" data-act="close_pr" data-pr="${pr.number}">close</button></div>
    </div>`;
  }).join('') || '<div class="run-empty">no open PRs</div>';

  const issuesHtml = issues.map(i => `<div class="rail-row">
      <a href="${REPO_URL ? REPO_URL + '/issues/' + i.number : '#'}" target="_blank">#${i.number}</a>
      <div>${esc(i.title)}</div>
      <div class="rmeta">${i._claimed ? 'claimed' : 'open'} · ${ago(i.updatedAt)}</div>
      <div class="actions">
        ${i._claimed ? `<button class="btn small" data-act="prune" data-issue="${i.number}">release</button>` : ''}
        <button class="btn small" data-act="comment_issue" data-issue="${i.number}">comment</button>
        <button class="btn small" data-act="close_issue" data-issue="${i.number}">close</button>
      </div>
    </div>`).join('') || '<div class="run-empty">backlog empty</div>';

  runListEl.innerHTML = `
    <div class="rail-section">
      <div class="rail-head">Open PRs <span class="count-badge">${prs.length}</span></div>
      ${prsHtml}
    </div>
    <div class="rail-section">
      <div class="rail-head">Backlog <span class="count-badge">${issues.length}</span>
        <button class="btn small" id="newIssue" style="margin-left:auto">+ new</button></div>
      ${issuesHtml}
    </div>`;
  document.getElementById('newIssue')?.addEventListener('click', async () => {
    const title = prompt('issue title:');
    if (!title) return;
    const lane = prompt('lane label (e.g. devops, ui, fleet) — optional:', '');
    const body = prompt('body — optional:', '');
    const r = await fetch('/api/create_issue', { method: 'POST', body: JSON.stringify({ title, lane, body }) });
    alert((await r.json()).ok ? 'filed' : 'failed — see server log');
  });
}

// ---------------------------------------------------------------------------------------------
// Settings page (sidebar item): the fleet-wide master toggle -- pulled out of the topbar so the
// topbar stays a status strip, not a place with a destructive action one misclick away.
// ---------------------------------------------------------------------------------------------
function renderSettingsPage() {
  if (PAGE !== 'settings') return;
  detailHeadEl.innerHTML = `<div class="title-row"><h2>Settings</h2></div>`;
  const on = !!FLEET_STATE.FLEET_ENABLED;
  runListEl.innerHTML = `
    <div class="settings-block">
      <h3>Fleet</h3>
      <div class="rmeta" style="margin-bottom:8px">repo: ${esc(REPO_URL || '—')}</div>
      <button class="btn ${on ? 'danger' : 'go'}" id="masterToggle">${on ? '■ stop fleet' : '● start fleet'}</button>
    </div>`;
  document.getElementById('masterToggle').onclick = async () => {
    if (on && !confirm('stop the WHOLE fleet? every member exits on its next tick.')) return;
    await fetch('/api/fleet_toggle', { method: 'POST', body: JSON.stringify({ target: 'fleet', value: !on }) });
    await renderFleetState();
    renderSettingsPage();
  };
}

// ---------------------------------------------------------------------------------------------
// Action bar clicks (rerun / enable-disable / dial edit / PR+issue actions) -- one delegated
// listener on body covers detail head + run list + rail.
// ---------------------------------------------------------------------------------------------
document.body.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const act = b.dataset.act;

  if (act === 'run-now') {
    const name = b.dataset.member;
    b.disabled = true; const prevText = b.textContent; b.textContent = 'starting…';
    const r = await fetch('/api/run_now', { method: 'POST', body: JSON.stringify({ member: name }) });
    const j = await r.json();
    b.disabled = false; b.textContent = prevText;
    if (!j.ok) alert(`failed: ${j.error || 'see server log'}`);
    // no alert on success -- the new run appears in the list itself within seconds, that IS the confirmation
    return;
  }
  if (act === 'toggle-member') {
    const willBeOn = b.dataset.on !== 'true';
    await fetch('/api/fleet_toggle', { method: 'POST', body: JSON.stringify({ target: b.dataset.member, value: willBeOn }) });
    await loadMembers(); renderSidebar(); renderDetailHead(); await renderQueue();
    return;
  }
  if (act === 'edit-dial') {
    const key = b.dataset.key;
    const value = prompt(`new value for ${b.dataset.member}.${key} (JSON):`);
    if (value === null) return;
    const why = prompt('why? (required)', 'tuned from console');
    if (!why) return;
    let parsed; try { parsed = JSON.parse(value); } catch { parsed = value; }
    const r = await fetch('/api/steer', { method: 'POST', body: JSON.stringify({ member: b.dataset.member, key, value: parsed, why }) });
    if ((await r.json()).ok) { await loadMembers(); renderDetailHead(); } else alert('failed — see server log');
    return;
  }
  if (act === 'prune') {
    if (!confirm(`release the claim on issue #${b.dataset.issue}?`)) return;
    const r = await fetch('/api/prune', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue }) });
    alert((await r.json()).ok ? 'released' : 'failed — see server log');
  } else if (act === 'close_pr') {
    if (!confirm(`close PR #${b.dataset.pr}?`)) return;
    const r = await fetch('/api/close_pr', { method: 'POST', body: JSON.stringify({ pr: b.dataset.pr }) });
    alert((await r.json()).ok ? 'closed' : 'failed — see server log');
  } else if (act === 'comment_issue') {
    const text = prompt(`comment on issue #${b.dataset.issue}:`);
    if (!text) return;
    const r = await fetch('/api/comment_issue', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue, body: text }) });
    alert((await r.json()).ok ? 'commented' : 'failed — see server log');
  } else if (act === 'close_issue') {
    if (!confirm(`close issue #${b.dataset.issue}?`)) return;
    const reason = confirm('mark "not planned" (cancel = "completed")?') ? 'not planned' : 'completed';
    const r = await fetch('/api/close_issue', { method: 'POST', body: JSON.stringify({ issue: b.dataset.issue, reason }) });
    alert((await r.json()).ok ? 'closed' : 'failed — see server log');
  }
});

// ---------------------------------------------------------------------------------------------
// Fleet state (master toggle) + members (spec/effective/overrides/spend) + queue (next fires)
// ---------------------------------------------------------------------------------------------
async function renderFleetState() {
  const state = await (await fetch('/api/fleet_state')).json();
  FLEET_STATE = state;
  REPO_URL = state.REPO_URL || '';
  document.getElementById('repo').textContent = REPO_URL ? REPO_URL.replace(/^https?:\/\//, '') : '';
}

async function loadMembers() {
  const [{ members }, { spend }, { kpi }] = await Promise.all([
    fetch('/api/members').then(r => r.json()),
    fetch('/api/spend?hours=24').then(r => r.json()),
    fetch('/api/kpi?hours=24').then(r => r.json()),
  ]);
  const spendByMember = Object.fromEntries((spend || []).map(s => [s.member, s]));
  members.forEach(m => { m._spend = spendByMember[m.spec.name]; });
  SPECS = members;
  KPI_BY_MEMBER = Object.fromEntries((kpi || []).map(k => [k.member, k]));
  const totalCost = (spend || []).reduce((sum, s) => sum + (s.total_cost || 0), 0);
  document.getElementById('globalSpend').innerHTML = `$${totalCost.toFixed(2)} <b>today</b>`;
  if (!SELECTED && SPECS.length) SELECTED = SPECS[0].spec.name;
}

async function renderQueue() {
  const { next_fires } = await (await fetch('/api/next_fires')).json();
  NEXT_FIRES = next_fires || [];
  // Bug (Reif, 2026-08-25 screenshot): this 15s-interval call rendered the agent detail head
  // over whatever page the user had actually navigated to (Self-Evolution's PR rows showing
  // under the last-selected agent's name/header) -- renderDetailHead() unconditionally
  // overwrites detailHeadEl with agent info regardless of PAGE. Guard it the same way
  // renderQueuePage/renderEvolutionPage/renderSettingsPage already guard themselves.
  if (PAGE === 'agent') renderDetailHead();
}

// ---------------------------------------------------------------------------------------------
// Live stream: new runs append to ALL_RUNS; re-render sidebar always (status dots), re-render
// run list + detail head only if the event is for the currently selected agent.
// ---------------------------------------------------------------------------------------------
function onRunEvent(rec) {
  ALL_RUNS.push(rec);
  if (ALL_RUNS.length > 2000) ALL_RUNS.shift();
  renderSidebar();
  if (PAGE === 'agent' && rec.member === SELECTED) { renderRunList(); renderDetailHead(); }
}

function appendLiveLine(rec) {
  if (rec.member !== SELECTED) return;
  const row = runListEl.querySelector('.run-row.open');
  const box = row && row.querySelector('.transcript.open');
  if (!box) return;
  box.insertAdjacentHTML('beforeend', renderTline(rec.line, 'live'));
}

async function boot() {
  const [snap] = await Promise.all([
    fetch('/api/snapshot').then(r => r.json()),
    renderFleetState(),
    loadMembers(),
  ]);
  ALL_RUNS = snap.runs || [];
  GH = snap.gh || { prs: [], issues: [], merged: [], self_evolution: [] };
  resortSidebar();
  renderSidebar();
  await renderQueue();
  selectAgent(SELECTED);
  // Same PAGE guard as renderQueue() above -- loadMembers() itself is page-agnostic (spend/KPI
  // data every page's sidebar KPI line needs), but renderDetailHead() is agent-page-only.
  setInterval(async () => { await loadMembers(); renderSidebar(); if (PAGE === 'agent') renderDetailHead(); }, 30000);
  setInterval(renderQueue, 15000);

  const es = new EventSource('/api/stream');
  es.onopen = () => dot.classList.add('live');
  es.onerror = () => dot.classList.remove('live');
  es.addEventListener('run', e => { onRunEvent(JSON.parse(e.data)); renderQueue(); });
  es.addEventListener('gh', e => { GH = JSON.parse(e.data); renderSidebar(); renderQueuePage(); renderMergedPage(); renderEvolutionPage(); });
  es.addEventListener('logline', e => appendLiveLine(JSON.parse(e.data)));
}
boot();
</script>
