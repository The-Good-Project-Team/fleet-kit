<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<!--
  fleet_home.html -- Console v2 (fk#645). One page, phone first, five blocks:
  the number, needs you, agents, landed today, footer. Nothing else.

  Reif, from his phone, 2026-09-07: "look at how unmobile friendly" and "likely a good time
  for a simple rebuild. We have way too many things going on on this page and can simplify
  down, way down." The question this page answers in ten seconds: is the fleet moving the
  number, and does it need me?

  No framework, no build step, no caching. Polls the existing JSON endpoints every 30s.
  The previous console is served at /classic until Reif accepts this one, then it goes.
  Design width is 390px; desktop is the same page, wider. Tap targets are 44px.
-->
<style>
  :root { --bg:#f6f7f8; --panel:#fff; --text:#161616; --muted:#6b7280; --line:#e5e7eb;
          --ok:#1f8b4c; --warn:#a6720f; --bad:#c13a2e; --accent:#2166c4; --off:#b9bcc2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --panel:#1b1c1f; --text:#ececec; --muted:#9aa0a6; --line:#2a2c30; --off:#4a4d52; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 40px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .big { font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; }
  .delta { font-weight: 600; }
  .up { color: var(--ok); } .down { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  td, th { text-align: left; padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-of-type { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .name { font-weight: 600; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; white-space: nowrap; }
  .outcome { color: var(--muted); font-size: 13px; padding: 0 4px 10px 24px; margin-top: -6px; }
  .drawer { padding: 8px 4px 12px 24px; border-top: 1px dashed var(--line); font-size: 14px; }
  .drawer .role { color: var(--muted); margin-bottom: 8px; }
  .drawer .role-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .drawer .run { padding: 4px 0; border-top: 1px solid var(--line); }
  .drawer .run:first-child { border-top: 0; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, a.btn { font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .5; }
  .ask { padding: 10px 0; border-top: 1px solid var(--line); }
  .ask:first-child { border-top: 0; }
  .ask .why { font-weight: 600; }
  .ask .why-detail { margin: 4px 0; }
  .ask .why-detail summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .ask .why-full { color: var(--muted); font-size: 13px; margin-top: 6px; white-space: pre-wrap; }
  .ask .prop { color: var(--muted); font-size: 14px; margin: 4px 0 8px; }
  .ask input { font: inherit; font-size: 15px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); width: 100%; }
  .empty { color: var(--muted); padding: 6px 4px; }
  .pr { display: block; padding: 8px 4px; border-top: 1px solid var(--line); color: var(--text); text-decoration: none; min-height: 44px; }
  .pr:first-child { border-top: 0; }
  .pr .t { font-weight: 500; } .pr .m { color: var(--muted); font-size: 13px; }
  .banner { background: #fff4e5; color: #7a4b00; border: 1px solid #f3d9a4; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-weight: 600; }
  .err { color: var(--bad); font-size: 13px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 26px; line-height: 1.8; }
  footer a { color: var(--accent); }
  @media (min-width: 700px) { main { padding: 20px; } .big { font-size: 40px; } }
  /* fk#748, Reif: "right slider, 1/3 page on click for more infos". One run, everything about
     it, in a panel that slides in from the right; the list behind it stays put. */
  .drawer .run[data-run] { cursor: pointer; border-radius: 6px; padding-left: 4px; margin-left: -4px; }
  .drawer .run[data-run]:hover { background: var(--bg); }
  .side-back { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 40; }
  .side { position: fixed; top: 0; right: 0; bottom: 0; width: 33.333vw; min-width: 360px; max-width: 640px;
    background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.12);
    z-index: 41; overflow-y: auto; padding: 16px 18px 40px; transform: translateX(100%); transition: transform .18s ease-out; }
  .side.in { transform: none; }
  @media (max-width: 700px) { .side { width: 100vw; min-width: 0; max-width: none; padding: 14px 14px 40px; } }
  .side .top { display: flex; align-items: flex-start; gap: 10px; }
  .side .top .name { font-size: 18px; }
  .side .top .close { margin-left: auto; min-width: 44px; padding: 0; font-size: 22px; line-height: 1; }
  .side .when { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .side .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .side .badge.ok { color: var(--ok); } .side .badge.warn { color: var(--warn); } .side .badge.bad { color: var(--bad); }
  .side h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .side .txt { font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .side .txt.report { border-left: 3px solid var(--accent); padding-left: 10px; }
  .side .txt a { color: var(--accent); }
  .side .none { color: var(--muted); font-style: italic; font-size: 14px; }
  .side .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .side .facts dt { color: var(--muted); } .side .facts dd { margin: 0; }
  .side pre.live { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; max-height: 40vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div id="banner"></div>
  <h1>The number</h1>
  <div class="card" id="number"><div class="sub">loading…</div></div>

  <!-- gh#553 fix 1: percent-of-week, alive/waiting-on-human/merged-24h and a link to Stats
       belong on the page Reif actually lands on, not one footer tap away on /classic. This is
       its OWN card, not folded into #number above -- renderNumber() returns early (unconfigured
       number, not yet measured), and this card must still render when that happens. -->
  <h1>Fleet</h1>
  <div class="card" id="health"><div class="sub">loading…</div></div>

  <h1>Needs you</h1>
  <div class="sub" id="asksSub"></div>
  <div class="card" id="asks"><div class="empty">loading…</div></div>

  <h1>Agents</h1>
  <div class="card" id="agents"><div class="empty">loading…</div></div>

  <h1>Landed today</h1>
  <div class="card" id="landed"><div class="empty">loading…</div></div>

  <footer id="foot"></footer>
</main>
<div id="sideBack" class="side-back" hidden></div>
<aside id="side" class="side" hidden aria-label="run details"></aside>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => (v === null || v === undefined) ? '--' : '$' + Number(v).toLocaleString('en-US', {maximumFractionDigits: 2});
const num = v => (v === null || v === undefined) ? '--' : Number(v).toLocaleString('en-US');
const ago = ts => { if (!ts) return 'never'; const s = Math.max(0, Date.now()/1000 - ts);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s/60)}m ago` : s < 86400 ? `${Math.round(s/3600)}h ago` : `${Math.round(s/86400)}d ago`; };
const signed = (v, fmt) => v === null || v === undefined ? '' : `<span class="delta ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '+' : '−'}${fmt(Math.abs(v))}</span> 7d`;
const centralDay = d => new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'}).format(d);

let OPEN = null;        // which agent drawer is open, survives re-renders
let OPEN_RUN = null;    // run_id shown in the side panel (fk#748), survives re-renders
let LIVE_TIMER = null;
let STATE = { number: null, plan: null, asks: [], members: [], runs: [], gh: {}, kpi: {}, spend: null, build: null, fleet: null, budget: null, homeSummary: null };

// gh#553 fix 1 (round 2): this console is served behind a path prefix (Caddy routes
// /fleet/<instance>/* to this backend, e.g. /fleet/fleet-kit/), but this page's own root-
// absolute URLs (`/api/...`, `/classic`, `/status`) ignore that prefix -- they resolve
// against the DOMAIN root, not the console's own mount point. That 404s every link, and
// worse: the unprefixed `/api/*` root is a *different* route that picks its backend from
// the Referer header, so a browser that sends no Referer (privacy mode, an in-app webview,
// `Referrer-Policy: no-referrer`) silently gets another instance's numbers under this
// instance's brand. Every URL this page builds must instead resolve from the document's own
// path, so it always lands back inside the same prefix Caddy already routed the browser to.
const BASE_PATH = (() => { const p = location.pathname; return p.endsWith('/') ? p : p + '/'; })();
const withBase = path => BASE_PATH + String(path).replace(/^\//, '');

async function getJSON(path) {
  const r = await fetch(withBase(path), {cache: 'no-store'});
  if (!r.ok) throw new Error(`${path} ${r.status}`);
  return r.json();
}
async function postJSON(path, body) {
  const r = await fetch(withBase(path), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error('sign in first (Settings on the classic console)');
  if (!r.ok || j.ok === false) throw new Error(j.error || `${path} ${r.status}`);
  return j;
}

// gh#553 VP review round 2, fix 5: FLEET card measured 2.20s to fill against a 1s budget
// because render() used to wait on all 9 boot fetches before drawing anything -- including
// kpi/spend/plan/asks/members/build, none of which renderBanner()/renderHealth() read. Both
// waves still start at the same instant (fired together below, same total network load), but
// the card's own two dependencies -- snapshot and fleet_state -- are no longer stuck behind
// whichever of the other seven happens to answer slowest.
//
// gh#876 round 3: that split wasn't enough -- the critical wave still carried /api/snapshot
// itself, ~570KB (runs[] last 500 + gh.{prs,issues,merged,self_evolution}), because
// renderHealth() reads a few fields out of it. /api/home_summary carries only those fields
// (same in-memory STATE, see State.home_summary() in fleet_view_server.py), so /api/snapshot
// moves to the rest wave -- it's still fetched (renderAgents/renderLanded need the full runs/gh
// data), just never on the card's own critical path.
async function load() {
  const criticalP = Promise.all([
    getJSON('/api/home_summary').catch(() => ({newest_ok_run_ts: null, merged_24h: 0, needs_human_op: {count: 0, oldest_age_hours: 0}})),
    getJSON('/api/fleet_state').catch(() => null),
  ]);
  const restP = Promise.all([
    getJSON('/api/snapshot').catch(() => ({runs: [], gh: {}})),
    getJSON('/api/number').catch(() => null),
    getJSON('/api/plan').catch(() => null),
    getJSON('/api/asks').catch(() => ({asks: []})),
    getJSON('/api/members').catch(() => ({members: []})),
    getJSON('/api/kpi').catch(() => ({kpi: []})),
    getJSON('/api/spend?hours=24').catch(() => null),
    getJSON('/api/build').catch(() => null),
  ]);
  const [summary, fleet] = await criticalP;
  STATE = { ...STATE, homeSummary: summary, fleet };
  renderBanner(); renderHealth();

  const [snap, number, plan, asks, members, kpi, spend, build] = await restP;
  STATE = { ...STATE, runs: snap.runs || [], gh: snap.gh || {}, number, plan, asks: asks.asks || [],
            members: members.members || [],
            kpi: Object.fromEntries((kpi.kpi || []).map(k => [k.member, k])), spend, build };
  // renderBanner()/renderHealth() already ran above off the critical wave and don't depend on
  // anything this second wave adds -- rerunning them here would just rewrite the same DOM twice.
  renderNumber(); renderAsks(); renderAgents(); renderLanded(); renderFoot();
}

// gh#553 fix 1: /api/budget_preview shells out to a real remote meter (maxx_reader.py) and can
// legitimately take seconds -- same reasoning fleet_view.html's refreshGlobalSpend() documents.
// Fetched on its own, never inside load()'s Promise.all, so a slow or failing meter read never
// delays or breaks the rest of the page.
async function refreshHealth() {
  // `STATE.budget = await ...` would resolve the STATE object reference before awaiting --
  // if load()'s `STATE = {...STATE, ...}` reassignment (a NEW object, not a mutation) lands
  // during that await, the write would go to the orphaned old object. Await into a local
  // first, then assign, so the assignment always targets whatever STATE currently is.
  let budget = null;
  try { budget = await getJSON('/api/budget_preview'); } catch (ex) { budget = null; }
  STATE.budget = budget;
  renderHealth();
}

function render() {
  renderBanner(); renderNumber(); renderHealth(); renderAsks(); renderAgents(); renderLanded(); renderFoot();
}

function renderBanner() {
  const f = STATE.fleet;
  $('banner').innerHTML = (f && f.FLEET_ENABLED === false) ? `<div class="banner">The fleet is paused. Nothing new starts until it is turned back on.</div>` : '';
  // gh#553 fix 5: the tab title comes from this instance's own config (FLEET_BRAND, or a name
  // derived from its repo), never a hardcoded product name.
  if (f && f.BRAND) document.title = f.BRAND;
}

function nextCheckpoint(plan) {
  // "Checkpoints on the number: $1,000 MRR by 2026-10-31 · $8,000 by 2026-11-30 · ..."
  const line = (plan && plan.checkpoints) || '';
  const today = centralDay(new Date());
  const hits = [...line.matchAll(/\$([\d,]+)[^·]*?by (\d{4}-\d{2}-\d{2})/g)].map(m => ({amount: m[1], by: m[2]}));
  return hits.find(h => h.by >= today) || hits[hits.length - 1] || null;
}

function renderNumber() {
  const d = STATE.number;
  if (!d || !d.configured) { $('number').innerHTML = `<div class="sub">No number configured for this fleet.</div>`; return; }
  if (!d.present || !d.payload || !d.payload.number) { $('number').innerHTML = `<div class="sub">Not measured yet.</div>`; return; }
  const p = d.payload, n = p.number, t = p.target || {}, g = p.guardrail, c = p.channel;
  const cp = nextCheckpoint(STATE.plan);
  const pct = t.value ? (100 * n.value / t.value) : null;
  $('number').innerHTML = `
    <div class="sub">${esc(n.name)}${d.stale ? ' · <span class="err">stale reading</span>' : ''}</div>
    <div class="big">${money(n.value)}<span class="sub">/mo</span></div>
    <div class="sub">${signed(n.delta_7d, money)} · target ${money(t.value)}/mo by ${esc(t.by || '?')}${pct !== null ? ` · ${pct.toFixed(2)}% there` : ''}</div>
    ${cp ? `<div class="sub">Next checkpoint: $${esc(cp.amount)}/mo by ${esc(cp.by)}</div>` : ''}
    <table>
      <tr><th>Key result</th><th class="num">Now</th><th class="num">7 days</th></tr>
      ${g ? `<tr><td>Orgs and people with at least one real interaction</td><td class="num">${num(g.value)}</td><td class="num">${signed(g.delta_7d, num)}</td></tr>` : ''}
      ${c ? `<tr><td>Visits, last full week</td><td class="num">${num(c.value)}</td><td class="num">${signed(c.delta_7d, num)}</td></tr>` : ''}
    </table>`;
}

// gh#876: needsHumanOp() still backs renderAsks() below, off the full STATE.gh the rest wave
// populates. renderHealth() no longer calls this (or a run/merged-count equivalent) -- it reads
// STATE.homeSummary instead, precisely so the card never waits on that wave.
function needsHumanOp() {
  return STATE.gh.needs_human_op || { count: 0, oldest_age_hours: 0 };
}

function renderHealth() {
  const pct = STATE.budget && STATE.budget.week_bank_pct;
  // null/undefined (meter unreadable or not configured) is its own visible state, never
  // shown as "0% of week" -- a real zero-headroom stall must not look identical to a quiet
  // meter (fleet_view.html's own renderGlobalSpend() comment, gh#561).
  const pctHtml = (pct === null || pct === undefined)
    ? `<span title="maxx meter unreadable or not configured for this instance">headroom unavailable</span>`
    : `${Number(pct).toFixed(1)}% of week`;
  // gh#876: sourced from /api/home_summary (STATE.homeSummary), not STATE.runs/STATE.gh --
  // those two only get populated once the rest wave's /api/snapshot resolves, which must
  // never gate this card's own render.
  const summary = STATE.homeSummary || {};
  const newest = summary.newest_ok_run_ts;
  const aliveHtml = (newest === null || newest === undefined) ? 'no ok run yet' : esc(ago(newest));
  const nho = summary.needs_human_op || { count: 0, oldest_age_hours: 0 };
  $('health').innerHTML = `
    <div class="sub">${pctHtml} · alive ${aliveHtml}</div>
    <div class="sub">Waiting on human ${num(nho.count)}${nho.count ? ` · oldest ${Math.round(nho.oldest_age_hours)}h` : ''} · merged 24h ${num(summary.merged_24h || 0)} · <a href="${withBase('/classic#stats')}">Stats</a></div>`;
}

// gh#553 VP review round 2, fix 4: the fleet's own asks are filed in raw engineering prose by
// whichever script hit trouble (gru_allowance.py, pacing_gate.py, ...) -- rewriting that text
// at the source would mean touching every ask-filing call site across the fleet, well past
// what this page can safely do. What this page CAN fix: it was showing that whole paragraph
// unconditionally, which is why Home ran ~8 screens of ask prose before Reif ever reached the
// AGENTS list (measured 8,497px). A short headline now stands in front, and the full text is
// one tap away instead of always on screen.
function askHeadline(why) {
  // Array.from() splits on code points, not UTF-16 code units, so a 110-char cut never
  // lands in the middle of a surrogate pair (e.g. an emoji) the way String.slice() can.
  const chars = Array.from(String(why || ''));
  if (chars.length <= 110) return chars.join('');
  const cut = chars.slice(0, 110);
  const sp = cut.lastIndexOf(' ');
  return (sp > 40 ? cut.slice(0, sp) : cut).join('') + '…';
}

function renderAsks() {
  const nho = needsHumanOp();
  $('asksSub').textContent = nho.count ? `${nho.count} waiting on human, oldest ${Math.round(nho.oldest_age_hours)}h` : '';
  const asks = STATE.asks;
  if (!asks.length) { $('asks').innerHTML = `<div class="empty">Nothing waiting on you.</div>`; return; }
  $('asks').innerHTML = asks.map(a => {
    const why = String(a.why || '');
    const headline = askHeadline(why);
    return `
    <div class="ask" data-id="${esc(a.id)}">
      <div class="why">${esc(headline)}</div>
      ${headline !== why ? `<details class="why-detail"><summary>full detail</summary><div class="why-full">${esc(why)}</div></details>` : ''}
      <div class="prop">${a.member ? `from ${esc(a.member)} · ` : ''}${a.unblocks ? `unblocks ${esc(a.unblocks)} · ` : ''}${a.proposed ? `fleet proposes: ${esc(a.proposed)}` : 'no proposed answer'}</div>
      <div class="btns">
        ${a.proposed ? `<button class="primary" data-act="answer" data-answer="${esc(a.proposed)}">Yes, do that</button>` : ''}
        <input placeholder="or answer in a sentence" data-act="text">
        <button data-act="send">Send</button>
      </div>
      <div class="err" data-act="err"></div>
    </div>`;
  }).join('');
}

function lastRuns(name) {
  return STATE.runs.filter(r => r.member === name).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
function dotClass(run, enabled) {
  if (!enabled && !(run && Date.now()/1000 - (run.ts || 0) < 6 * 3600)) return '';
  if (!run) return '';
  const s = run.status || '';
  if (s === 'ok') return 'ok';
  if (['killed', 'timed_out', 'failed', 'error', 'reported_nothing', 'incomplete_fanout', 'report_lost'].includes(s) || (run.exit_code && run.exit_code !== 0)) return 'bad';
  return 'warn';
}
function renderAgents() {
  const ms = STATE.members;
  if (!ms.length) { $('agents').innerHTML = `<div class="empty">No agents found.</div>`; return; }
  const ranked = ms.map(m => ({m, last: lastRuns(m.spec.name)[0] || null})).sort((a, b) => ((b.last && b.last.ts) || 0) - ((a.last && a.last.ts) || 0));
  $('agents').innerHTML = ranked.map(({m, last}) => {
    const name = m.spec.name, enabled = !!m.effective.enabled, k = STATE.kpi[name];
    const count = (k && k.total !== null && k.total !== undefined && k.unit) ? `${k.total} ${k.unit} today` : '';
    const open = OPEN === name;
    const runs = open ? lastRuns(name).slice(0, 5) : [];
    return `
      <div class="row" data-agent="${esc(name)}">
        <span class="dot ${dotClass(last, enabled)}"></span>
        <span class="name">${esc(m.spec.emoji || '')} ${esc(name)}${enabled ? '' : ' <span class="sub">(paused)</span>'}</span>
        <span class="meta">${last ? esc(ago(last.ts)) : 'never run'}${count ? `<br>${esc(count)}` : ''}</span>
      </div>
      ${last && last.outcome ? `<div class="outcome">${esc(String(last.outcome).slice(0, 140))}</div>` : ''}
      ${open ? `<div class="drawer">
          <div class="role"><span class="role-label">Purpose</span>${esc((m.spec.mandate || {}).target || '')}</div>
          ${runs.map(r => `<div class="run" data-run="${esc(r.run_id || '')}"><span class="dot ${dotClass(r, true)}" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${esc(ago(r.ts))} · ${esc(r.status || '')}${r.pr ? ` · <a href="${esc(String(r.pr).startsWith('http') ? r.pr : '#')}" target="_blank">PR</a>` : ''}<br><span class="sub">${esc(String(r.outcome || '').slice(0, 200))}</span></div>`).join('') || '<div class="sub">no runs yet</div>'}
          <div class="btns">
            <button class="primary" data-act="rerun" data-member="${esc(name)}">Rerun now</button>
            <button class="${enabled ? 'danger' : ''}" data-act="toggle" data-member="${esc(name)}" data-on="${enabled}">${enabled ? 'Pause' : 'Resume'}</button>
          </div>
          <div class="err" data-act="err"></div>
        </div>` : ''}`;
  }).join('');
}

function renderLanded() {
  const merged = (STATE.gh.merged || []);
  const today = centralDay(new Date());
  const rows = merged.filter(pr => pr.mergedAt && centralDay(new Date(pr.mergedAt)) === today)
    .sort((a, b) => new Date(b.mergedAt) - new Date(a.mergedAt));
  if (!rows.length) { $('landed').innerHTML = `<div class="empty">Nothing merged yet today (Central time).</div>`; return; }
  $('landed').innerHTML = rows.map(pr => `<a class="pr" href="${esc(pr.url)}" target="_blank">
      <div class="t">${esc(pr.title)}</div>
      <div class="m">#${esc(pr.number)} · ${esc((pr.author && pr.author.login) || '')} · ${esc(ago(new Date(pr.mergedAt).getTime()/1000))}</div>
    </a>`).join('');
}

function renderFoot() {
  const s = STATE.spend, b = STATE.build;
  const total = s && s.spend ? s.spend.reduce((a, r) => a + (r.total_cost || 0), 0) : null;
  $('foot').innerHTML = `
    ${total !== null ? `Spent ${money(total)} in the last 24 hours.<br>` : ''}
    ${b && b.sha ? `Live build ${esc(String(b.sha).slice(0, 7))}${b.started_at ? `, up since ${esc(ago(b.started_at))}` : ''}.<br>` : ''}
    <a href="${withBase('/classic')}">Classic console</a> · <a href="${withBase('/classic#settings')}">Settings and sign in</a> · <a href="${withBase('/status')}">Status</a> · updated ${esc(new Date().toLocaleTimeString('en-US', {timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit'}))} CT`;
}

// ---- fk#748: the run panel. Click a run, everything about that one run slides in from the right.
function repoBase() {
  const pr = (STATE.gh.merged || []).find(p => p.url);
  return pr ? String(pr.url).replace(/\/pull\/\d+.*$/, '') : null;
}
function linkify(text) {
  const base = repoBase(), h = esc(text);
  return base ? h.replace(/(^|[^\w/&])#(\d{2,6})\b/g, (m, pre, n) => `${pre}<a href="${base}/issues/${n}" target="_blank">#${n}</a>`) : h;
}
function statusClass(rec) {
  const st = rec && rec.status;
  if (!st || st === 'started') return '';
  if (st === 'ok') return 'ok';
  if (st === 'quiet' || st === 'budget_declined' || st === 'reported_nothing') return 'warn';
  return 'bad';
}
function findRun(id) {
  const all = STATE.runs.filter(r => r.run_id === id);
  return all.find(r => r.status !== 'started') || all[0] || null;
}
function section(title, text, cls) {
  return `<h2>${esc(title)}</h2>${text ? `<div class="txt ${cls || ''}">${linkify(text)}</div>` : `<div class="none">none</div>`}`;
}
function renderRun() {
  const side = $('side'), back = $('sideBack');
  const rec = OPEN_RUN && findRun(OPEN_RUN);
  if (!rec) { side.hidden = true; back.hidden = true; side.classList.remove('in'); if (LIVE_TIMER) { clearInterval(LIVE_TIMER); LIVE_TIMER = null; } return; }
  const m = STATE.members.find(x => x.spec.name === rec.member);
  const t = rec.tokens || {};
  const dur = t.duration_ms ? `${Math.round(t.duration_ms / 60000)} min` : (rec.status === 'started' ? 'running' : '--');
  const live = rec.status === 'started';
  const base = repoBase();
  const links = [rec.pr && base ? `<a href="${base}/pull/${esc(rec.pr)}" target="_blank">PR #${esc(rec.pr)}</a>` : '',
                 rec.item_id && base ? `<a href="${base}/issues/${esc(rec.item_id)}" target="_blank">issue #${esc(rec.item_id)}</a>` : ''].filter(Boolean).join(' · ');
  side.innerHTML = `
    <div class="top"><span class="name">${esc((m && m.spec.emoji) || '')} ${esc(rec.member)}</span>
      <button class="close" data-act="closeRun" aria-label="close">×</button></div>
    <div class="when">${esc(ago(rec.ts))} · ${esc(new Date(rec.ts * 1000).toLocaleString('en-US', {timeZone: 'America/Chicago', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}))} CT
      · <span class="badge ${statusClass(rec)}">${esc(live ? 'running' : rec.status || '')}</span></div>
    <dl class="facts">
      <dt>Took</dt><dd>${esc(dur)}</dd>
      <dt>Cost</dt><dd>${t.cost_usd !== undefined ? esc(money(t.cost_usd)) : '--'}${t.num_turns ? ` · ${esc(t.num_turns)} turns` : ''}</dd>
      ${links ? `<dt>Links</dt><dd>${links}</dd>` : ''}
      <dt>Run</dt><dd style="overflow-wrap:anywhere;color:var(--muted);font-size:12px">${esc(rec.run_id || '')}</dd>
    </dl>
    ${live ? `<h2>Report</h2><div class="none">still running; the outcome and report land here when the pass ends</div>
    <h2>Live transcript</h2><pre class="live" id="liveLog">loading…</pre>` : `
    ${section('Outcome', rec.outcome)}
    ${section('Evidence', rec.evidence)}
    ${rec.report ? section('Report', rec.report, 'report') : `<h2>Report</h2><div class="none">no written report for this run</div>`}
    ${section('Self-critique', rec.self_critique)}`}`;
  side.hidden = false; back.hidden = false;
  requestAnimationFrame(() => side.classList.add('in'));
  if (LIVE_TIMER) { clearInterval(LIVE_TIMER); LIVE_TIMER = null; }
  if (live) { loadLive(rec); LIVE_TIMER = setInterval(() => loadLive(rec), 10000); }
}
async function loadLive(rec) {
  try {
    const d = await getJSON(`/api/pass_log?member=${encodeURIComponent(rec.member)}&n=0`);
    const el = $('liveLog'); if (!el) return;
    const lines = (d.lines || []).slice(-60).map(l => typeof l === 'string' ? l : (l.text || JSON.stringify(l)));
    el.textContent = lines.length ? lines.join('\n') : 'no transcript yet';
    el.scrollTop = el.scrollHeight;
  } catch (ex) { const el = $('liveLog'); if (el) el.textContent = ex.message; }
}
function openRun(id) { OPEN_RUN = id; renderRun(); }
function closeRun() { OPEN_RUN = null; renderRun(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN_RUN) closeRun(); });
$('sideBack').addEventListener('click', closeRun);

document.addEventListener('click', async e => {
  const row = e.target.closest('.row[data-agent]');
  if (row) { OPEN = OPEN === row.dataset.agent ? null : row.dataset.agent; renderAgents(); return; }
  const runEl = e.target.closest('.run[data-run]');
  if (runEl && runEl.dataset.run) { openRun(runEl.dataset.run); return; }
  if (e.target.closest('[data-act="closeRun"]')) { closeRun(); return; }
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const box = btn.closest('.drawer, .ask');
  const err = box && box.querySelector('[data-act="err"]');
  btn.disabled = true;
  try {
    if (btn.dataset.act === 'rerun') { await postJSON('/api/run_now', {member: btn.dataset.member}); btn.textContent = 'Started'; }
    else if (btn.dataset.act === 'toggle') { await postJSON('/api/fleet_toggle', {target: btn.dataset.member, value: btn.dataset.on !== 'true'}); await load(); }
    else if (btn.dataset.act === 'answer' || btn.dataset.act === 'send') {
      const answer = btn.dataset.act === 'answer' ? btn.dataset.answer : (box.querySelector('[data-act="text"]').value || '').trim();
      if (!answer) throw new Error('write an answer first');
      await postJSON('/api/asks/answer', {id: Number(box.dataset.id), answer});
      await load();
    }
  } catch (ex) {
    if (err) err.textContent = ex.message;
    btn.disabled = false;
  }
});

load().catch(ex => { $('number').innerHTML = `<div class="err">${esc(ex.message)}</div>`; });
refreshHealth();
setInterval(() => load().catch(() => {}), 30000);
setInterval(refreshHealth, 30000);
</script>
</body>
</html>
